openapi: 3.1.0
info:
  title: OpenAI API — Realtime
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
paths:
  /realtime/calls:
    post:
      summary: >-
        Create a new Realtime API call over WebRTC and receive the SDP answer needed to complete the peer connection.
      operationId: create-realtime-call
      tags:
      - Realtime
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RealtimeCallCreateRequest"
            encoding:
              sdp:
                contentType: application/sdp
              session:
                contentType: application/json
          application/sdp:
            schema:
              type: string
              description: >-
                WebRTC SDP offer. Use this variant when you have previously created an ephemeral **session token** and are authenticating the request with it. Realtime session parameters will be retrieved from the session token.
      responses:
        "201":
          description: Realtime call created successfully.
          headers:
            Location:
              description: Relative URL containing the call ID for subsequent control requests.
              schema:
                type: string
          content:
            application/sdp:
              schema:
                type: string
                description: SDP answer produced by OpenAI for the peer connection.
  /realtime/calls/{call_id}/accept:
    post:
      summary: |-
        Accept an incoming SIP call and configure the realtime session that will handle it.
      operationId: accept-realtime-call
      tags:
      - Realtime
      parameters:
      - in: path
        name: call_id
        required: true
        schema:
          type: string
        description: |-
          The identifier for the call provided in the [`realtime.call.incoming`](/docs/api-reference/webhook-events/realtime/call/incoming) webhook.
      requestBody:
        required: true
        description: Session configuration to apply before the caller is bridged to the model.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSessionCreateRequestGA"
      responses:
        "200":
          description: Call accepted successfully.
  /realtime/calls/{call_id}/hangup:
    post:
      summary: |-
        End an active Realtime API call, whether it was initiated over SIP or WebRTC.
      operationId: hangup-realtime-call
      tags:
      - Realtime
      parameters:
      - in: path
        name: call_id
        required: true
        schema:
          type: string
        description: |-
          The identifier for the call. For SIP calls, use the value provided in the [`realtime.call.incoming`](/docs/api-reference/webhook-events/realtime/call/incoming) webhook. For WebRTC sessions, reuse the call ID returned in the `Location` header when creating the call with [`POST /v1/realtime/calls`](/docs/api-reference/realtime/create-call).
      responses:
        "200":
          description: Call hangup initiated successfully.
  /realtime/calls/{call_id}/refer:
    post:
      summary: Transfer an active SIP call to a new destination using the SIP REFER verb.
      operationId: refer-realtime-call
      tags:
      - Realtime
      parameters:
      - in: path
        name: call_id
        required: true
        schema:
          type: string
        description: |-
          The identifier for the call provided in the [`realtime.call.incoming`](/docs/api-reference/webhook-events/realtime/call/incoming) webhook.
      requestBody:
        required: true
        description: Destination URI for the REFER request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeCallReferRequest"
      responses:
        "200":
          description: Call referred successfully.
  /realtime/calls/{call_id}/reject:
    post:
      summary: Decline an incoming SIP call by returning a SIP status code to the caller.
      operationId: reject-realtime-call
      tags:
      - Realtime
      parameters:
      - in: path
        name: call_id
        required: true
        schema:
          type: string
        description: |-
          The identifier for the call provided in the [`realtime.call.incoming`](/docs/api-reference/webhook-events/realtime/call/incoming) webhook.
      requestBody:
        required: false
        description: >-
          Provide an optional SIP status code. When omitted the API responds with `603 Decline`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeCallRejectRequest"
      responses:
        "200":
          description: Call rejected successfully.
  /realtime/client_secrets:
    post:
      summary: >-
        Create a Realtime client secret with an associated session configuration.

        Client secrets are short-lived tokens that can be passed to a client app, such as a web frontend or mobile client, which grants access to the Realtime API without leaking your main API key. You can configure a custom TTL for each client secret.

        You can also attach session configuration options to the client secret, which will be applied to any sessions created using that client secret, but these can also be overridden by the client connection.

        [Learn more about authentication with client secrets over WebRTC](/docs/guides/realtime-webrtc).

        Returns the created client secret and the effective session object. The client secret is a string that looks like `ek_1234`.
      operationId: create-realtime-client-secret
      tags:
      - Realtime
      requestBody:
        description: Create a client secret with the given session configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeCreateClientSecretRequest"
      responses:
        "200":
          description: Client secret created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeCreateClientSecretResponse"
  /realtime/translations/client_secrets:
    post:
      summary: >-
        Create a Realtime translation client secret with an associated translation session configuration.

        Client secrets are short-lived tokens that can be passed to a client app, such as a web frontend or mobile client, which grants access to the Realtime Translation API without leaking your main API key. You can configure a custom TTL for each client secret.

        Returns the created client secret and the effective translation session object. The client secret is a string that looks like `ek_1234`.
      operationId: create-realtime-translation-client-secret
      tags:
      - Realtime
      requestBody:
        description: Create a client secret with the given translation session configuration.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeTranslationClientSecretCreateRequest"
      responses:
        "200":
          description: Translation client secret created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTranslationClientSecretCreateResponse"
components:
  schemas:
    AudioTranscription:
      type: object
      properties:
        model:
          description: >-
            The model to use for transcription. Current options are `whisper-1`, `gpt-transcribe`, `gpt-live-transcribe`, `gpt-4o-mini-transcribe`, `gpt-4o-mini-transcribe-2025-12-15`, `gpt-4o-transcribe`, `gpt-4o-transcribe-diarize`, and `gpt-realtime-whisper`. Use `gpt-4o-transcribe-diarize` when you need diarization with speaker labels.
          anyOf:
          - type: string
          - type: string
            enum:
            - whisper-1
            - gpt-transcribe
            - gpt-live-transcribe
            - gpt-4o-mini-transcribe
            - gpt-4o-mini-transcribe-2025-12-15
            - gpt-4o-transcribe
            - gpt-4o-transcribe-diarize
            - gpt-realtime-whisper
        language:
          type: string
          description: >-
            The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) (e.g. `en`) format will improve accuracy and latency.
        languages:
          type: array
          description: >-
            Possible languages of the input audio, in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) format. Supported by `gpt-transcribe` and `gpt-live-transcribe`.
          minItems: 1
          items:
            type: string
        keywords:
          type: array
          description: >-
            Words or phrases to guide transcription of the input audio. Supported by `gpt-transcribe` and `gpt-live-transcribe`.
          items:
            type: string
        prompt:
          type: string
          description: >-
            An optional text to guide the model's style or continue a previous audio segment. For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting). For `gpt-4o-transcribe` models (excluding `gpt-4o-transcribe-diarize`), the prompt is a free text string, for example "expect words related to technology". Prompt is not supported with `gpt-realtime-whisper` in GA Realtime sessions.
        delay:
          type: string
          description: >-
            Controls how long the model waits before emitting transcription text. Higher values can improve transcription accuracy at the cost of latency. Only supported with `gpt-realtime-whisper` in GA Realtime sessions.
          enum:
          - minimal
          - low
          - medium
          - high
          - xhigh
    AudioTranscriptionResponse:
      type: object
      properties:
        model:
          description: >-
            The model used for transcription. Current options are `whisper-1`, `gpt-transcribe`, `gpt-live-transcribe`, `gpt-4o-mini-transcribe`, `gpt-4o-mini-transcribe-2025-12-15`, `gpt-4o-transcribe`, `gpt-4o-transcribe-diarize`, and `gpt-realtime-whisper`.
          anyOf:
          - type: string
          - type: string
            enum:
            - whisper-1
            - gpt-transcribe
            - gpt-live-transcribe
            - gpt-4o-mini-transcribe
            - gpt-4o-mini-transcribe-2025-12-15
            - gpt-4o-transcribe
            - gpt-4o-transcribe-diarize
            - gpt-realtime-whisper
        language:
          type: string
          description: |-
            The language of the input audio.
        languages:
          type: array
          description: >-
            The possible input audio languages configured for transcription, in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) format.
          minItems: 1
          items:
            type: string
        prompt:
          type: string
          description: |-
            The prompt configured for input audio transcription, when present.
    CallableToolAllowedCaller:
      type: string
      enum:
      - direct
      - programmatic
    FileInputDetail:
      type: string
      enum:
      - auto
      - low
      - high
    ImageDetail:
      type: string
      enum:
      - low
      - high
      - auto
      - original
    InputFileContent:
      properties:
        type:
          type: string
          enum:
          - input_file
          description: The type of the input item. Always `input_file`.
          default: input_file
          x-stainless-const: true
        file_id:
          anyOf:
          - type: string
            description: The ID of the file to be sent to the model.
          - type: "null"
        filename:
          type: string
          description: The name of the file to be sent to the model.
        file_data:
          type: string
          description: |-
            The content of the file to be sent to the model.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
        file_url:
          type: string
          format: uri
          description: The URL of the file to be sent to the model.
        detail:
          $ref: "#/components/schemas/FileInputDetail"
          description: The detail level of the file to be sent to the model. Use `auto` to let the system select the detail level; for GPT-5.6 and later models, `auto` uses high-quality rendering, which may increase input token usage. Use `low` for lower-cost rendering, or `high` to render the file at higher quality. Defaults to `auto`.
      type: object
      required:
      - type
      title: Input file
      description: A file input to the model.
    InputImageContent:
      properties:
        type:
          type: string
          enum:
          - input_image
          description: The type of the input item. Always `input_image`.
          default: input_image
          x-stainless-const: true
        image_url:
          anyOf:
          - type: string
            format: uri
            description: The URL of the image to be sent to the model. A fully qualified URL or base64 encoded image in a data URL.
          - type: "null"
        file_id:
          anyOf:
          - type: string
            description: The ID of the file to be sent to the model.
          - type: "null"
        detail:
          $ref: "#/components/schemas/ImageDetail"
          description: The detail level of the image to be sent to the model. One of `high`, `low`, `auto`, or `original`. Defaults to `auto`.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
      type: object
      required:
      - type
      - detail
      title: Input image
      description: An image input to the model. Learn about [image inputs](/docs/guides/vision).
    InputTextContent:
      properties:
        type:
          type: string
          enum:
          - input_text
          description: The type of the input item. Always `input_text`.
          default: input_text
          x-stainless-const: true
        text:
          type: string
          description: The text input to the model.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
      type: object
      required:
      - type
      - text
      title: Input text
      description: A text input to the model.
    MCPTool:
      type: object
      title: MCP tool
      description: >-
        Give the model access to additional tools via remote Model Context Protocol (MCP) servers. [Learn more about MCP](/docs/guides/tools-remote-mcp).
      properties:
        type:
          type: string
          enum:
          - mcp
          description: The type of the MCP tool. Always `mcp`.
          x-stainless-const: true
        server_label:
          type: string
          description: |-
            A label for this MCP server, used to identify it in tool calls.
        server_url:
          type: string
          format: uri
          description: |-
            The URL for the MCP server. One of `server_url`, `connector_id`, or `tunnel_id` must be provided.
        connector_id:
          type: string
          enum:
          - connector_dropbox
          - connector_gmail
          - connector_googlecalendar
          - connector_googledrive
          - connector_microsoftteams
          - connector_outlookcalendar
          - connector_outlookemail
          - connector_sharepoint
          description: >-
            Identifier for service connectors, like those available in ChatGPT. One of `server_url`, `connector_id`, or `tunnel_id` must be provided. Learn more about service connectors [here](/docs/guides/tools-remote-mcp#connectors).

            Currently supported `connector_id` values are:

            - Dropbox: `connector_dropbox`

            - Gmail: `connector_gmail`

            - Google Calendar: `connector_googlecalendar`

            - Google Drive: `connector_googledrive`

            - Microsoft Teams: `connector_microsoftteams`

            - Outlook Calendar: `connector_outlookcalendar`

            - Outlook Email: `connector_outlookemail`

            - SharePoint: `connector_sharepoint`
        tunnel_id:
          type: string
          pattern: ^tunnel_[a-z0-9]{32}$
          description: >-
            The Secure MCP Tunnel ID to use instead of a direct server URL. One of `server_url`, `connector_id`, or `tunnel_id` must be provided.
        authorization:
          type: string
          description: >-
            An OAuth access token that can be used with a remote MCP server, either with a custom MCP server URL or a service connector. Your application must handle the OAuth authorization flow and provide the token here.
        server_description:
          type: string
          description: >-
            Optional description of the MCP server, used to provide more context.
        headers:
          anyOf:
          - type: object
            additionalProperties:
              type: string
            description: >-
              Optional HTTP headers to send to the MCP server. Use for authentication or other purposes.
          - type: "null"
        allowed_tools:
          anyOf:
          - description: |-
              List of allowed tool names or a filter object.
            oneOf:
            - type: array
              title: MCP allowed tools
              description: A string array of allowed tool names
              items:
                type: string
            - $ref: "#/components/schemas/MCPToolFilter"
          - type: "null"
        allowed_callers:
          anyOf:
          - type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            description: The tool invocation context(s).
          - type: "null"
        require_approval:
          anyOf:
          - description: Specify which of the MCP server's tools require approval.
            oneOf:
            - type: object
              title: MCP tool approval filter
              description: >-
                Specify which of the MCP server's tools require approval. Can be `always`, `never`, or a filter object associated with tools that require approval.
              properties:
                always:
                  $ref: "#/components/schemas/MCPToolFilter"
                never:
                  $ref: "#/components/schemas/MCPToolFilter"
              additionalProperties: false
            - type: string
              title: MCP tool approval setting
              description: >-
                Specify a single approval policy for all tools. One of `always` or `never`. When set to `always`, all tools will require approval. When set to `never`, all tools will not require approval.
              enum:
              - always
              - never
            default: always
          - type: "null"
        defer_loading:
          type: boolean
          description: |-
            Whether this MCP tool is deferred and discovered via tool search.
      required:
      - type
      - server_label
    MCPToolFilter:
      type: object
      title: MCP tool filter
      description: |-
        A filter object to specify which tools are allowed.
      properties:
        tool_names:
          type: array
          title: MCP allowed tools
          items:
            type: string
          description: List of allowed tool names.
        read_only:
          type: boolean
          description: |-
            Indicates whether or not a tool modifies data or is read-only. If an MCP server is [annotated with `readOnlyHint`](https://modelcontextprotocol.io/specification/2025-06-18/schema#toolannotations-readonlyhint), it will match this filter.
      required: []
      additionalProperties: false
    NoiseReductionType:
      type: string
      enum:
      - near_field
      - far_field
      description: >-
        Type of noise reduction. `near_field` is for close-talking microphones such as headphones, `far_field` is for far-field microphones such as laptop or conference room microphones.
    Prompt:
      anyOf:
      - type: object
        description: |-
          Reference to a prompt template and its variables. [Learn more](/docs/guides/text?api-mode=responses#reusable-prompts).
        required:
        - id
        properties:
          id:
            type: string
            description: The unique identifier of the prompt template to use.
          version:
            anyOf:
            - type: string
              description: Optional version of the prompt template.
            - type: "null"
          variables:
            $ref: "#/components/schemas/ResponsePromptVariables"
      - type: "null"
    PromptCacheBreakpointConfig:
      properties:
        mode:
          type: string
          enum:
          - explicit
          description: The breakpoint mode. Always `explicit`.
          default: explicit
          x-stainless-const: true
      type: object
      required:
      - mode
      title: Prompt cache breakpoint
      description: Marks the exact end of a reusable prompt prefix. The breakpoint inherits its TTL from the request's `prompt_cache_options.ttl`; the boundary is not rounded to a token block.
    RealtimeAudioFormats:
      anyOf:
      - type: object
        title: PCM audio format
        description: The PCM audio format. Only a 24kHz sample rate is supported.
        properties:
          type:
            type: string
            description: The audio format. Always `audio/pcm`.
            enum:
            - audio/pcm
          rate:
            type: integer
            description: The sample rate of the audio. Always `24000`.
            enum:
            - 24000
      - type: object
        title: PCMU audio format
        description: The G.711 μ-law format.
        properties:
          type:
            type: string
            description: The audio format. Always `audio/pcmu`.
            enum:
            - audio/pcmu
      - type: object
        title: PCMA audio format
        description: The G.711 A-law format.
        properties:
          type:
            type: string
            description: The audio format. Always `audio/pcma`.
            enum:
            - audio/pcma
    RealtimeCallCreateRequest:
      title: Realtime call creation request
      type: object
      description: >-
        Parameters required to initiate a realtime call and receive the SDP answer needed to complete a WebRTC peer connection. Provide an SDP offer generated by your client and optionally configure the session that will answer the call.
      required:
      - sdp
      properties:
        sdp:
          type: string
          description: WebRTC Session Description Protocol (SDP) offer generated by the caller.
        session:
          title: Session configuration
          allOf:
          - $ref: "#/components/schemas/RealtimeSessionCreateRequestGA"
          description: |-
            Optional session configuration to apply before the realtime session is created. Use the same parameters you would send in a [`create client secret`](/docs/api-reference/realtime-sessions/create-realtime-client-secret) request.
      additionalProperties: false
    RealtimeCallReferRequest:
      title: Realtime call refer request
      type: object
      description: >-
        Parameters required to transfer a SIP call to a new destination using the Realtime API.
      required:
      - target_uri
      properties:
        target_uri:
          type: string
          description: >-
            URI that should appear in the SIP Refer-To header. Supports values like `tel:+14155550123` or `sip:agent@example.com`.
          example: tel:+14155550123
      additionalProperties: false
    RealtimeCallRejectRequest:
      title: Realtime call reject request
      type: object
      description: Parameters used to decline an incoming SIP call handled by the Realtime API.
      properties:
        status_code:
          type: integer
          description: >-
            SIP response code to send back to the caller. Defaults to `603` (Decline) when omitted.
          example: 486
      additionalProperties: false
    RealtimeCreateClientSecretRequest:
      type: object
      title: Realtime client secret creation request
      description: >-
        Create a session and client secret for the Realtime API. The request can specify either a realtime or a transcription session configuration. [Learn more about the Realtime API](/docs/guides/realtime).
      properties:
        expires_after:
          type: object
          title: Client secret expiration
          description: >-
            Configuration for the client secret expiration. Expiration refers to the time after which a client secret will no longer be valid for creating sessions. The session itself may continue after that time once started. A secret can be used to create multiple sessions until it expires.
          properties:
            anchor:
              type: string
              enum:
              - created_at
              description: >-
                The anchor point for the client secret expiration, meaning that `seconds` will be added to the `created_at` time of the client secret to produce an expiration timestamp. Only `created_at` is currently supported.
              default: created_at
              x-stainless-const: true
            seconds:
              type: integer
              format: int64
              description: >-
                The number of seconds from the anchor point to the expiration. Select a value between `10` and `7200` (2 hours). This default to 600 seconds (10 minutes) if not specified.
              minimum: 10
              maximum: 7200
              default: 600
        session:
          title: Session configuration
          description: >-
            Session configuration to use for the client secret. Choose either a realtime session or a transcription session.
          oneOf:
          - $ref: "#/components/schemas/RealtimeSessionCreateRequestGA"
          - $ref: "#/components/schemas/RealtimeTranscriptionSessionCreateRequestGA"
    RealtimeCreateClientSecretResponse:
      type: object
      title: Realtime session and client secret
      description: |-
        Response from creating a session and client secret for the Realtime API.
      properties:
        value:
          type: string
          description: The generated client secret value.
        expires_at:
          type: integer
          format: unixtime
          description: Expiration timestamp for the client secret, in seconds since epoch.
        session:
          title: Session configuration
          description: >-
            The session configuration for either a realtime or transcription session.
          oneOf:
          - $ref: "#/components/schemas/RealtimeSessionCreateResponseGA"
          - $ref: "#/components/schemas/RealtimeTranscriptionSessionCreateResponseGA"
          discriminator:
            propertyName: type
      required:
      - value
      - expires_at
      - session
    RealtimeFunctionTool:
      type: object
      title: Function tool
      properties:
        type:
          type: string
          enum:
          - function
          description: The type of the tool, i.e. `function`.
          x-stainless-const: true
        name:
          type: string
          description: The name of the function.
        description:
          type: string
          description: |-
            The description of the function, including guidance on when and how to call it, and guidance about what to tell the user when calling (if anything).
        parameters:
          type: object
          description: Parameters of the function in JSON Schema.
    RealtimeReasoning:
      type: object
      title: Realtime reasoning configuration
      description: >-
        Configuration for reasoning-capable Realtime models such as `gpt-realtime-2`.
      properties:
        effort:
          $ref: "#/components/schemas/RealtimeReasoningEffort"
    RealtimeReasoningEffort:
      type: string
      description: >-
        Constrains effort on reasoning for reasoning-capable Realtime models such as `gpt-realtime-2`.
      enum:
      - minimal
      - low
      - medium
      - high
      - xhigh
      default: low
    RealtimeSessionCreateRequestGA:
      type: object
      title: Realtime session configuration
      description: Realtime session object configuration.
      properties:
        type:
          type: string
          description: >-
            The type of session to create. Always `realtime` for the Realtime API.
          enum:
          - realtime
          x-stainless-const: true
        output_modalities:
          type: array
          description: >-
            The set of modalities the model can respond with. It defaults to `["audio"]`, indicating that the model will respond with audio plus a transcript. `["text"]` can be used to make the model respond with text only. It is not possible to request both `text` and `audio` at the same time.
          default:
          - audio
          items:
            type: string
            enum:
            - text
            - audio
        model:
          anyOf:
          - type: string
          - type: string
            enum:
            - gpt-realtime
            - gpt-realtime-1.5
            - gpt-realtime-2
