openapi: 3.1.0
info:
  title: OpenAI API — Evals
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Evals
  description: Manage and run evals in the OpenAI platform.
paths:
  /evals:
    get:
      operationId: listEvals
      tags:
      - Evals
      summary: |-
        List evaluations for a project.
      parameters:
      - name: after
        in: query
        description: Identifier for the last eval from the previous pagination request.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of evals to retrieve.
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        description: Sort order for evals by timestamp. Use `asc` for ascending order or `desc` for descending order.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: order_by
        in: query
        description: >-
          Evals can be ordered by creation time or last updated time. Use `created_at` for creation time or `updated_at` for last updated time.
        required: false
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          default: created_at
      responses:
        "200":
          description: A list of evals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalList"
    post:
      operationId: createEval
      tags:
      - Evals
      summary: >-
        Create the structure of an evaluation that can be used to test a model's performance. An evaluation is a set of testing criteria and the config for a data source, which dictates the schema of the data used in the evaluation. After creating an evaluation, you can run it on different models and model parameters. We support several types of graders and datasources. For more information, see the [Evals guide](/docs/guides/evals).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvalRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eval"
  /evals/{eval_id}:
    get:
      operationId: getEval
      tags:
      - Evals
      summary: |-
        Get an evaluation by ID.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to retrieve.
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eval"
    post:
      operationId: updateEval
      tags:
      - Evals
      summary: |-
        Update certain properties of an evaluation.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to update.
      requestBody:
        description: Request to update an evaluation
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Rename the evaluation.
                metadata:
                  $ref: "#/components/schemas/Metadata"
      responses:
        "200":
          description: The updated evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eval"
    delete:
      operationId: deleteEval
      tags:
      - Evals
      summary: |-
        Delete an evaluation.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to delete.
      responses:
        "200":
          description: Successfully deleted the evaluation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: eval.deleted
                  deleted:
                    type: boolean
                    example: true
                  eval_id:
                    type: string
                    example: eval_abc123
                required:
                - object
                - deleted
                - eval_id
        "404":
          description: Evaluation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /evals/{eval_id}/runs:
    get:
      operationId: getEvalRuns
      tags:
      - Evals
      summary: |-
        Get a list of runs for an evaluation.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to retrieve runs for.
      - name: after
        in: query
        description: Identifier for the last run from the previous pagination request.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of runs to retrieve.
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        description: Sort order for runs by timestamp. Use `asc` for ascending order or `desc` for descending order. Defaults to `asc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: status
        in: query
        description: Filter runs by status. One of `queued` | `in_progress` | `failed` | `completed` | `canceled`.
        required: false
        schema:
          type: string
          enum:
          - queued
          - in_progress
          - completed
          - canceled
          - failed
      responses:
        "200":
          description: A list of runs for the evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunList"
    post:
      operationId: createEvalRun
      tags:
      - Evals
      summary: >-
        Kicks off a new run for a given evaluation, specifying the data source, and what model configuration to use to test. The datasource will be validated against the schema specified in the config of the evaluation.
      parameters:
      - in: path
        name: eval_id
        required: true
        schema:
          type: string
        description: The ID of the evaluation to create a run for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvalRunRequest"
      responses:
        "201":
          description: Successfully created a run for the evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
        "400":
          description: Bad request (for example, missing eval object)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /evals/{eval_id}/runs/{run_id}:
    get:
      operationId: getEvalRun
      tags:
      - Evals
      summary: |-
        Get an evaluation run by ID.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to retrieve runs for.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the run to retrieve.
      responses:
        "200":
          description: The evaluation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
    post:
      operationId: cancelEvalRun
      tags:
      - Evals
      summary: |-
        Cancel an ongoing evaluation run.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation whose run you want to cancel.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the run to cancel.
      responses:
        "200":
          description: The canceled eval run object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
    delete:
      operationId: deleteEvalRun
      tags:
      - Evals
      summary: |-
        Delete an eval run.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to delete the run from.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the run to delete.
      responses:
        "200":
          description: Successfully deleted the eval run
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: eval.run.deleted
                  deleted:
                    type: boolean
                    example: true
                  run_id:
                    type: string
                    example: evalrun_677469f564d48190807532a852da3afb
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /evals/{eval_id}/runs/{run_id}/output_items:
    get:
      operationId: getEvalRunOutputItems
      tags:
      - Evals
      summary: |-
        Get a list of output items for an evaluation run.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to retrieve runs for.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the run to retrieve output items for.
      - name: after
        in: query
        description: Identifier for the last output item from the previous pagination request.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of output items to retrieve.
        required: false
        schema:
          type: integer
          default: 20
      - name: status
        in: query
        description: >-
          Filter output items by status. Use `failed` to filter by failed output items or `pass` to filter by passed output items.
        required: false
        schema:
          type: string
          enum:
          - fail
          - pass
      - name: order
        in: query
        description: Sort order for output items by timestamp. Use `asc` for ascending order or `desc` for descending order. Defaults to `asc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        "200":
          description: A list of output items for the evaluation run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunOutputItemList"
  /evals/{eval_id}/runs/{run_id}/output_items/{output_item_id}:
    get:
      operationId: getEvalRunOutputItem
      tags:
      - Evals
      summary: |-
        Get an evaluation run output item by ID.
      parameters:
      - name: eval_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the evaluation to retrieve runs for.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the run to retrieve.
      - name: output_item_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the output item to retrieve.
      responses:
        "200":
          description: The evaluation run output item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRunOutputItem"
components:
  schemas:
    ApplyPatchToolParam:
      properties:
        type:
          type: string
          enum:
          - apply_patch
          description: The type of the tool. Always `apply_patch`.
          default: apply_patch
          x-stainless-const: true
        allowed_callers:
          anyOf:
          - items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            type: array
            minItems: 1
            description: The tool invocation context(s).
          - type: "null"
      type: object
      required:
      - type
      title: Apply patch tool
      description: Allows the assistant to create, delete, or update files using unified diffs.
    ApproximateLocation:
      properties:
        type:
          type: string
          enum:
          - approximate
          description: The type of location approximation. Always `approximate`.
          default: approximate
          x-stainless-const: true
        country:
          anyOf:
          - type: string
            description: The two-letter [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the user, e.g. `US`.
          - type: "null"
        region:
          anyOf:
          - type: string
            description: Free text input for the region of the user, e.g. `California`.
          - type: "null"
        city:
          anyOf:
          - type: string
            description: Free text input for the city of the user, e.g. `San Francisco`.
          - type: "null"
        timezone:
          anyOf:
          - type: string
            description: The [IANA timezone](https://timeapi.io/documentation/iana-timezones) of the user, e.g. `America/Los_Angeles`.
          - type: "null"
      type: object
      required:
      - type
    AutoCodeInterpreterToolParam:
      properties:
        type:
          type: string
          enum:
          - auto
          description: Always `auto`.
          default: auto
          x-stainless-const: true
        file_ids:
          items:
            type: string
            example: file-123
          type: array
          maxItems: 50
          description: An optional list of uploaded files to make available to your code.
        memory_limit:
          anyOf:
          - $ref: "#/components/schemas/ContainerMemoryLimit"
            description: The memory limit for the code interpreter container.
          - type: "null"
        network_policy:
          oneOf:
          - $ref: "#/components/schemas/ContainerNetworkPolicyDisabledParam"
          - $ref: "#/components/schemas/ContainerNetworkPolicyAllowlistParam"
          description: Network access policy for the container.
          discriminator:
            propertyName: type
      type: object
      required:
      - type
      title: CodeInterpreterToolAuto
      description: Configuration for a code interpreter container. Optionally specify the IDs of the files to run the code on.
    CallableToolAllowedCaller:
      type: string
      enum:
      - direct
      - programmatic
    ChatCompletionTool:
      type: object
      title: Function tool
      description: |-
        A function tool that can be used to generate a response.
      properties:
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
          x-stainless-const: true
        function:
          $ref: "#/components/schemas/FunctionObject"
      required:
      - type
      - function
    CodeInterpreterTool:
      type: object
      title: Code interpreter
      description: |-
        A tool that runs Python code to help generate a response to a prompt.
      properties:
        type:
          type: string
          enum:
          - code_interpreter
          description: |-
            The type of the code interpreter tool. Always `code_interpreter`.
          x-stainless-const: true
        container:
          description: >-
            The code interpreter container. Can be a container ID or an object that specifies uploaded file IDs to make available to your code, along with an optional `memory_limit` setting.
          oneOf:
          - type: string
            description: The container ID.
          - $ref: "#/components/schemas/AutoCodeInterpreterToolParam"
        allowed_callers:
          anyOf:
          - type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            description: The tool invocation context(s).
          - type: "null"
      required:
      - type
      - container
    ComparisonFilter:
      type: object
      additionalProperties: false
      title: Comparison Filter
      description: >-
        A filter used to compare a specified attribute key to a given value using a defined comparison operation.
      properties:
        type:
          type: string
          default: eq
          enum:
          - eq
          - ne
          - gt
          - gte
          - lt
          - lte
          - in
          - nin
          description: >-
            Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`.

            - `eq`: equals

            - `ne`: not equal

            - `gt`: greater than

            - `gte`: greater than or equal

            - `lt`: less than

            - `lte`: less than or equal

            - `in`: in

            - `nin`: not in
        key:
          type: string
          description: The key to compare against the value.
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              oneOf:
              - type: string
              - type: number
          description: The value to compare against the attribute key; supports string, number, or boolean types.
      required:
      - type
      - key
      - value
    CompoundFilter:
      $recursiveAnchor: true
      type: object
      additionalProperties: false
      title: Compound Filter
      description: Combine multiple filters using `and` or `or`.
      properties:
        type:
          type: string
          description: "Type of operation: `and` or `or`."
          enum:
          - and
          - or
        filters:
          type: array
          description: Array of filters to combine. Items can be `ComparisonFilter` or `CompoundFilter`.
          items:
            oneOf:
            - $ref: "#/components/schemas/ComparisonFilter"
            - $recursiveRef: "#"
            discriminator:
              propertyName: type
      required:
      - type
      - filters
    ComputerEnvironment:
      type: string
      enum:
      - windows
      - mac
      - linux
      - ubuntu
      - browser
    ComputerTool:
      properties:
        type:
          type: string
          enum:
          - computer
          description: The type of the computer tool. Always `computer`.
          default: computer
          x-stainless-const: true
      type: object
      required:
      - type
      title: Computer
      description: A tool that controls a virtual computer. Learn more about the [computer tool](https://platform.openai.com/docs/guides/tools-computer-use).
    ComputerUsePreviewTool:
      properties:
        type:
          type: string
          enum:
          - computer_use_preview
          description: The type of the computer use tool. Always `computer_use_preview`.
          default: computer_use_preview
          x-stainless-const: true
        environment:
          $ref: "#/components/schemas/ComputerEnvironment"
          description: The type of computer environment to control.
        display_width:
          type: integer
          description: The width of the computer display.
        display_height:
          type: integer
          description: The height of the computer display.
      type: object
      required:
      - type
      - environment
      - display_width
      - display_height
      title: Computer use preview
      description: A tool that controls a virtual computer. Learn more about the [computer tool](https://platform.openai.com/docs/guides/tools-computer-use).
    ContainerAutoParam:
      properties:
        type:
          type: string
          enum:
          - container_auto
          description: Automatically creates a container for this request
          default: container_auto
          x-stainless-const: true
        file_ids:
          items:
            type: string
            example: file-123
          type: array
          maxItems: 50
          description: An optional list of uploaded files to make available to your code.
        memory_limit:
          anyOf:
          - $ref: "#/components/schemas/ContainerMemoryLimit"
            description: The memory limit for the container.
          - type: "null"
        network_policy:
          oneOf:
          - $ref: "#/components/schemas/ContainerNetworkPolicyDisabledParam"
          - $ref: "#/components/schemas/ContainerNetworkPolicyAllowlistParam"
          description: Network access policy for the container.
          discriminator:
            propertyName: type
        skills:
          items:
            oneOf:
            - $ref: "#/components/schemas/SkillReferenceParam"
            - $ref: "#/components/schemas/InlineSkillParam"
            discriminator:
              propertyName: type
          type: array
          maxItems: 200
          description: An optional list of skills referenced by id or inline data.
      type: object
      required:
      - type
    ContainerMemoryLimit:
      type: string
      enum:
      - 1g
      - 4g
      - 16g
      - 64g
    ContainerNetworkPolicyAllowlistParam:
      properties:
        type:
          type: string
          enum:
          - allowlist
          description: Allow outbound network access only to specified domains. Always `allowlist`.
          default: allowlist
          x-stainless-const: true
        allowed_domains:
          items:
            type: string
          type: array
          minItems: 1
          description: A list of allowed domains when type is `allowlist`.
        domain_secrets:
          items:
            $ref: "#/components/schemas/ContainerNetworkPolicyDomainSecretParam"
          type: array
          minItems: 1
          description: Optional domain-scoped secrets for allowlisted domains.
      type: object
      required:
      - type
      - allowed_domains
    ContainerNetworkPolicyDisabledParam:
      properties:
        type:
          type: string
          enum:
          - disabled
          description: Disable outbound network access. Always `disabled`.
          default: disabled
          x-stainless-const: true
      type: object
      required:
      - type
    ContainerNetworkPolicyDomainSecretParam:
      properties:
        domain:
          type: string
          minLength: 1
          description: The domain associated with the secret.
        name:
          type: string
          minLength: 1
          description: The name of the secret to inject for the domain.
        value:
          type: string
          maxLength: 10485760
          minLength: 1
          description: The secret value to inject for the domain.
      type: object
      required:
      - domain
      - name
      - value
    ContainerReferenceParam:
      properties:
        type:
          type: string
          enum:
          - container_reference
          description: References a container created with the /v1/containers endpoint
          default: container_reference
          x-stainless-const: true
        container_id:
          type: string
          description: The ID of the referenced container.
          example: cntr_123
      type: object
      required:
      - type
      - container_id
    CreateEvalCompletionsRunDataSource:
      type: object
      title: CompletionsRunDataSource
      description: >-
        A CompletionsRunDataSource object describing a model sampling configuration.
      properties:
        type:
          type: string
          enum:
          - completions
          default: completions
          description: The type of run data source. Always `completions`.
        input_messages:
          description: Used when sampling from a model. Dictates the structure of the messages passed into the model. Can either be a reference to a prebuilt trajectory (ie, `item.input_trajectory`), or a template with variable references to the `item` namespace.
          oneOf:
          - type: object
            title: TemplateInputMessages
            properties:
              type:
                type: string
                enum:
                - template
                description: The type of input messages. Always `template`.
              template:
                type: array
                description: A list of chat messages forming the prompt or context. May include variable references to the `item` namespace, ie {{item.name}}.
                items:
                  oneOf:
                  - $ref: "#/components/schemas/EasyInputMessage"
                  - $ref: "#/components/schemas/EvalItem"
            required:
            - type
            - template
          - type: object
            title: ItemReferenceInputMessages
            properties:
              type:
                type: string
                enum:
                - item_reference
                description: The type of input messages. Always `item_reference`.
              item_reference:
                type: string
                description: A reference to a variable in the `item` namespace. Ie, "item.input_trajectory"
            required:
            - type
            - item_reference
        sampling_params:
          type: object
          properties:
            reasoning_effort:
              $ref: "#/components/schemas/ReasoningEffort"
            temperature:
              type: number
              description: A higher temperature increases randomness in the outputs.
              default: 1
            max_completion_tokens:
              type: integer
              description: The maximum number of tokens in the generated output.
            top_p:
              type: number
              description: An alternative to temperature for nucleus sampling; 1.0 includes all tokens.
              default: 1
            seed:
              type: integer
              description: A seed value to initialize the randomness, during sampling.
              default: 42
            response_format:
              description: >-
                An object specifying the format that the model must output.

                Setting to `{ "type": "json_schema", "json_schema": {...} }` enables Structured Outputs which ensures the model will match your supplied JSON schema. Learn more in the [Structured Outputs guide](/docs/guides/structured-outputs).

                Setting to `{ "type": "json_object" }` enables the older JSON mode, which ensures the message the model generates is valid JSON. Using `json_schema` is preferred for models that support it.
              oneOf:
              - $ref: "#/components/schemas/ResponseFormatText"
              - $ref: "#/components/schemas/ResponseFormatJsonSchema"
              - $ref: "#/components/schemas/ResponseFormatJsonObject"
            tools:
              type: array
              description: >-
                A list of tools the model may call. Currently, only functions are supported as a tool. Use this to provide a list of functions the model may generate JSON inputs for. A max of 128 functions are supported.
              items:
                $ref: "#/components/schemas/ChatCompletionTool"
        model:
          type: string
          description: The name of the model to use for generating completions (e.g. "o3-mini").
        source:
          description: Determines what populates the `item` namespace in this run's data source.
          oneOf:
          - $ref: "#/components/schemas/EvalJsonlFileContentSource"
          - $ref: "#/components/schemas/EvalJsonlFileIdSource"
          - $ref: "#/components/schemas/EvalStoredCompletionsSource"
      required:
      - type
      - source
    CreateEvalCustomDataSourceConfig:
      type: object
      title: CustomDataSourceConfig
      description: >-
        A CustomDataSourceConfig object that defines the schema for the data source used for the evaluation runs. This schema is used to define the shape of the data that will be:

        - Used to define your testing criteria and

        - What data is required when creating a run
      properties:
        type:
          type: string
          enum:
          - custom
          default: custom
          description: The type of data source. Always `custom`.
          x-stainless-const: true
        item_schema:
          type: object
          description: The json schema for each row in the data source.
          additionalProperties: true
          example: |
            {
              "type": "object",
              "properties": {
                "name": {"type": "string"},
                "age": {"type": "integer"}
              },
              "required": ["name", "age"]
            }
        include_sample_schema:
          type: boolean
          default: false
          description: Whether the eval should expect you to populate the sample namespace (ie, by generating responses off of your data source)
      required:
      - item_schema
      - type
    CreateEvalItem:
      title: CreateEvalItem
      description: A chat message that makes up the prompt or context. May include variable references to the `item` namespace, ie {{item.name}}.
      type: object
      oneOf:
      - type: object
        title: SimpleInputMessage
        properties:
          role:
            type: string
            description: The role of the message (e.g. "system", "assistant", "user").
          content:
            type: string
            description: The content of the message.
        required:
        - role
        - content
      - $ref: "#/components/schemas/EvalItem"
    CreateEvalJsonlRunDataSource:
      type: object
      title: JsonlRunDataSource
      description: >-
        A JsonlRunDataSource object with that specifies a JSONL file that matches the eval
      properties:
        type:
          type: string
          enum:
          - jsonl
          default: jsonl
          description: The type of data source. Always `jsonl`.
          x-stainless-const: true
        source:
          description: Determines what populates the `item` namespace in the data source.
          oneOf:
          - $ref: "#/components/schemas/EvalJsonlFileContentSource"
          - $ref: "#/components/schemas/EvalJsonlFileIdSource"
      required:
      - type
      - source
    CreateEvalLabelModelGrader:
      type: object
      title: LabelModelGrader
      description: >-
        A LabelModelGrader object which uses a model to assign labels to each item in the evaluation.
      properties:
        type:
          description: The object type, which is always `label_model`.
          type: string
          enum:
          - label_model
          x-stainless-const: true
        name:
          type: string
          description: The name of the grader.
        model:
          type: string
          description: The model to use for the evaluation. Must support structured outputs.
        input:
          type: array
          description: A list of chat messages forming the prompt or context. May include variable references to the `item` namespace, ie {{item.name}}.
          items:
            $ref: "#/components/schemas/CreateEvalItem"
        labels:
          type: array
          items:
            type: string
          description: The labels to classify to each item in the evaluation.
        passing_labels:
          type: array
          items:
            type: string
          description: The labels that indicate a passing result. Must be a subset of labels.
      required:
      - type
      - model
      - input
      - passing_labels
      - labels
      - name
    CreateEvalLogsDataSourceConfig:
      type: object
      title: LogsDataSourceConfig
      description: >-
        A data source config which specifies the metadata property of your logs query. This is usually metadata like `usecase=chatbot` or `prompt-version=v2`, etc.
      properties:
        type:
          type: string
          enum:
          - logs
          default: logs
          description: The type of data source. Always `logs`.
          x-stainless-const: true
        metadata:
          type: object
          description: Metadata filters for the logs data source.
          additionalProperties: true
          example: |
            {
              "use_case": "customer_support_agent"
            }
      required:
      - type
    CreateEvalRequest:
      type: object
      title: CreateEvalRequest
      properties:
        name:
          type: string
          description: The name of the evaluation.
        metadata:
          $ref: "#/components/schemas/Metadata"
        data_source_config:
          type: object
          description: The configuration for the data source used for the evaluation runs. Dictates the schema of the data used in the evaluation.
          oneOf:
          - $ref: "#/components/schemas/CreateEvalCustomDataSourceConfig"
          - $ref: "#/components/schemas/CreateEvalLogsDataSourceConfig"
          - $ref: "#/components/schemas/CreateEvalStoredCompletionsDataSourceConfig"
        testing_criteria:
          type: array
          description: A list of graders for all eval runs in this group. Graders can reference variables in the data source using double curly braces notation, like `{{item.variable_name}}`. To reference the model's output, use the `sample` namespace (ie, `{{sample.output_text}}`).
          items:
            oneOf:
            - $ref: "#/components/schemas/CreateEvalLabelModelGrader"
            - $ref: "#/components/schemas/EvalGraderStringCheck"
            - $ref: "#/components/schemas/EvalGraderTextSimilarity"
            - $ref: "#/components/schemas/EvalGraderPython"
            - $ref: "#/components/schemas/EvalGraderScoreModel"
      required:
      - data_source_config
      - testing_criteria
    CreateEvalResponsesRunDataSource:
      type: object
      title: ResponsesRunDataSource
      description: >-
        A ResponsesRunDataSource object describing a model sampling configuration.
      properties:
        type:
          type: string
          enum:
          - responses
          default: responses
          description: The type of run data source. Always `responses`.
        input_messages:
          description: Used when sampling from a model. Dictates the structure of the messages passed into the model. Can either be a reference to a prebuilt trajectory (ie, `item.input_trajectory`), or a template with variable references to the `item` namespace.
          oneOf:
          - type: object
            title: InputMessagesTemplate
            properties:
              type:
                type: string
                enum:
                - template
                description: The type of input messages. Always `template`.
              template:
                type: array
                description: A list of chat messages forming the prompt or context. May include variable references to the `item` namespace, ie {{item.name}}.
                items:
                  oneOf:
                  - type: object
                    title: ChatMessage
                    properties:
                      role:
                        type: string
                        description: The role of the message (e.g. "system", "assistant", "user").
                      content:
                        type: string
                        description: The content of the message.
                    required:
                    - role
                    - content
                  - $ref: "#/components/schemas/EvalItem"
            required:
            - type
            - template
          - type: object
            title: InputMessagesItemReference
            properties:
              type:
                type: string
                enum:
                - item_reference
                description: The type of input messages. Always `item_reference`.
              item_reference:
                type: string
                description: A reference to a variable in the `item` namespace. Ie, "item.name"
            required:
            - type
            - item_reference
        sampling_params:
          type: object
          properties:
            reasoning_effort:
              $ref: "#/components/schemas/ReasoningEffort"
            temperature:
              type: number
              description: A higher temperature increases randomness in the outputs.
              default: 1
            max_completion_tokens:
              type: integer
              description: The maximum number of tokens in the generated output.
            top_p:
              type: number
              description: An alternative to temperature for nucleus sampling; 1.0 includes all tokens.
              default: 1
            seed:
              type: integer
              description: A seed value to initialize the randomness, during sampling.
              default: 42
            tools:
              type: array
              description: >-
                An array of tools the model may call while generating a response. You can specify which tool to use by setting the `tool_choice` parameter.

                The two categories of tools you can provide the model are:

                - **Built-in tools**: Tools that are provided by OpenAI that extend the   model's capabilities, like [web search](/docs/guides/tools-web-search)   or [file search](/docs/guides/tools-file-search). Learn more about   [built-in tools](/docs/guides/tools).

                - **Function calls (custom tools)**: Functions that are defined by you,   enabling the model to call your own code. Learn more about   [function calling](/docs/guides/function-calling).
              items:
                $ref: "#/components/schemas/Tool"
            text:
              type: object
              description: >-
                Configuration options for a text response from the model. Can be plain text or structured JSON data. Learn more:

                - [Text inputs and outputs](/docs/guides/text)

                - [Structured Outputs](/docs/guides/structured-outputs)
              properties:
                format:
                  $ref: "#/components/schemas/TextResponseFormatConfiguration"
        model:
          type: string
          description: The name of the model to use for generating completions (e.g. "o3-mini").
        source:
          description: Determines what populates the `item` namespace in this run's data source.
          oneOf:
          - $ref: "#/components/schemas/EvalJsonlFileContentSource"
          - $ref: "#/components/schemas/EvalJsonlFileIdSource"
          - $ref: "#/components/schemas/EvalResponsesSource"
      required:
      - type
      - source
    CreateEvalRunRequest:
      type: object
      title: CreateEvalRunRequest
      properties:
        name:
          type: string
          description: The name of the run.
        metadata:
          $ref: "#/components/schemas/Metadata"
        data_source:
          type: object
          description: Details about the run's data source.
          oneOf:
          - $ref: "#/components/schemas/CreateEvalJsonlRunDataSource"
          - $ref: "#/components/schemas/CreateEvalCompletionsRunDataSource"
          - $ref: "#/components/schemas/CreateEvalResponsesRunDataSource"
      required:
      - data_source
    CreateEvalStoredCompletionsDataSourceConfig:
      type: object
      title: StoredCompletionsDataSourceConfig
      description: |-
        Deprecated in favor of LogsDataSourceConfig.
      properties:
        type:
          type: string
          enum:
          - stored_completions
          default: stored_completions
          description: The type of data source. Always `stored_completions`.
          x-stainless-const: true
        metadata:
          type: object
          description: Metadata filters for the stored completions data source.
          additionalProperties: true
          example: |
            {
              "use_case": "customer_support_agent"
            }
      required:
      - type
      deprecated: true
    CustomGrammarFormatParam:
      properties:
        type:
          type: string
