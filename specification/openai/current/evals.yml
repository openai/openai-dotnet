          default: inline
          x-stainless-const: true
        name:
          type: string
          description: The name of the skill.
        description:
          type: string
          description: The description of the skill.
        source:
          $ref: "#/components/schemas/InlineSkillSourceParam"
          description: Inline skill payload
      type: object
      required:
      - type
      - name
      - description
      - source
    InlineSkillSourceParam:
      properties:
        type:
          type: string
          enum:
          - base64
          description: The type of the inline skill source. Must be `base64`.
          default: base64
          x-stainless-const: true
        media_type:
          type: string
          enum:
          - application/zip
          description: The media type of the inline skill payload. Must be `application/zip`.
          default: application/zip
          x-stainless-const: true
        data:
          type: string
          maxLength: 70254592
          minLength: 1
          description: Base64-encoded skill zip bundle.
      type: object
      required:
      - type
      - media_type
      - data
      description: Inline skill payload
    InputAudio:
      type: object
      title: Input audio
      description: |-
        An audio input to the model.
      properties:
        type:
          type: string
          description: |-
            The type of the input item. Always `input_audio`.
          enum:
          - input_audio
          x-stainless-const: true
        input_audio:
          type: object
          properties:
            data:
              type: string
              description: |-
                Base64-encoded audio data.
            format:
              type: string
              description: >-
                The format of the audio data. Currently supported formats are `mp3` and `wav`.
              enum:
              - mp3
              - wav
          required:
          - data
          - format
      required:
      - type
      - input_audio
    InputContent:
      oneOf:
      - $ref: "#/components/schemas/InputTextContent"
      - $ref: "#/components/schemas/InputImageContent"
      - $ref: "#/components/schemas/InputFileContent"
      discriminator:
        propertyName: type
    InputFidelity:
      type: string
      enum:
      - high
      - low
      description: Control how much effort the model will exert to match the style and features, especially facial features, of input images. This parameter is only supported for `gpt-image-1` and `gpt-image-1.5` and later models, unsupported for `gpt-image-1-mini`. Supports `high` and `low`. Defaults to `low`.
    InputFileContent:
      properties:
        type:
          type: string
          enum:
          - input_file
          description: The type of the input item. Always `input_file`.
          default: input_file
          x-stainless-const: true
        file_id:
          anyOf:
          - type: string
            description: The ID of the file to be sent to the model.
          - type: "null"
        filename:
          type: string
          description: The name of the file to be sent to the model.
        file_data:
          type: string
          description: |-
            The content of the file to be sent to the model.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
        file_url:
          type: string
          format: uri
          description: The URL of the file to be sent to the model.
        detail:
          $ref: "#/components/schemas/FileInputDetail"
          description: The detail level of the file to be sent to the model. Use `auto` to let the system select the detail level; for GPT-5.6 and later models, `auto` uses high-quality rendering, which may increase input token usage. Use `low` for lower-cost rendering, or `high` to render the file at higher quality. Defaults to `auto`.
      type: object
      required:
      - type
      title: Input file
      description: A file input to the model.
    InputImageContent:
      properties:
        type:
          type: string
          enum:
          - input_image
          description: The type of the input item. Always `input_image`.
          default: input_image
          x-stainless-const: true
        image_url:
          anyOf:
          - type: string
            format: uri
            description: The URL of the image to be sent to the model. A fully qualified URL or base64 encoded image in a data URL.
          - type: "null"
        file_id:
          anyOf:
          - type: string
            description: The ID of the file to be sent to the model.
          - type: "null"
        detail:
          $ref: "#/components/schemas/ImageDetail"
          description: The detail level of the image to be sent to the model. One of `high`, `low`, `auto`, or `original`. Defaults to `auto`.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
      type: object
      required:
      - type
      - detail
      title: Input image
      description: An image input to the model. Learn about [image inputs](/docs/guides/vision).
    InputMessageContentList:
      type: array
      title: Input item content list
      description: >-
        A list of one or many input items to the model, containing different content  types.
      items:
        $ref: "#/components/schemas/InputContent"
    InputTextContent:
      properties:
        type:
          type: string
          enum:
          - input_text
          description: The type of the input item. Always `input_text`.
          default: input_text
          x-stainless-const: true
        text:
          type: string
          description: The text input to the model.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointConfig"
      type: object
      required:
      - type
      - text
      title: Input text
      description: A text input to the model.
    LocalEnvironmentParam:
      properties:
        type:
          type: string
          enum:
          - local
          description: Use a local computer environment.
          default: local
          x-stainless-const: true
        skills:
          items:
            $ref: "#/components/schemas/LocalSkillParam"
          type: array
          maxItems: 200
          description: An optional list of skills.
      type: object
      required:
      - type
    LocalShellToolParam:
      properties:
        type:
          type: string
          enum:
          - local_shell
          description: The type of the local shell tool. Always `local_shell`.
          default: local_shell
          x-stainless-const: true
      type: object
      required:
      - type
      title: Local shell tool
      description: A tool that allows the model to execute shell commands in a local environment.
    LocalSkillParam:
      properties:
        name:
          type: string
          description: The name of the skill.
        description:
          type: string
          description: The description of the skill.
        path:
          type: string
          description: The path to the directory containing the skill.
      type: object
      required:
      - name
      - description
      - path
    MCPTool:
      type: object
      title: MCP tool
      description: >-
        Give the model access to additional tools via remote Model Context Protocol (MCP) servers. [Learn more about MCP](/docs/guides/tools-remote-mcp).
      properties:
        type:
          type: string
          enum:
          - mcp
          description: The type of the MCP tool. Always `mcp`.
          x-stainless-const: true
        server_label:
          type: string
          description: |-
            A label for this MCP server, used to identify it in tool calls.
        server_url:
          type: string
          format: uri
          description: |-
            The URL for the MCP server. One of `server_url`, `connector_id`, or `tunnel_id` must be provided.
        connector_id:
          type: string
          enum:
          - connector_dropbox
          - connector_gmail
          - connector_googlecalendar
          - connector_googledrive
          - connector_microsoftteams
          - connector_outlookcalendar
          - connector_outlookemail
          - connector_sharepoint
          description: >-
            Identifier for service connectors, like those available in ChatGPT. One of `server_url`, `connector_id`, or `tunnel_id` must be provided. Learn more about service connectors [here](/docs/guides/tools-remote-mcp#connectors).

            Currently supported `connector_id` values are:

            - Dropbox: `connector_dropbox`

            - Gmail: `connector_gmail`

            - Google Calendar: `connector_googlecalendar`

            - Google Drive: `connector_googledrive`

            - Microsoft Teams: `connector_microsoftteams`

            - Outlook Calendar: `connector_outlookcalendar`

            - Outlook Email: `connector_outlookemail`

            - SharePoint: `connector_sharepoint`
        tunnel_id:
          type: string
          pattern: ^tunnel_[a-z0-9]{32}$
          description: >-
            The Secure MCP Tunnel ID to use instead of a direct server URL. One of `server_url`, `connector_id`, or `tunnel_id` must be provided.
        authorization:
          type: string
          description: >-
            An OAuth access token that can be used with a remote MCP server, either with a custom MCP server URL or a service connector. Your application must handle the OAuth authorization flow and provide the token here.
        server_description:
          type: string
          description: >-
            Optional description of the MCP server, used to provide more context.
        headers:
          anyOf:
          - type: object
            additionalProperties:
              type: string
            description: >-
              Optional HTTP headers to send to the MCP server. Use for authentication or other purposes.
          - type: "null"
        allowed_tools:
          anyOf:
          - description: |-
              List of allowed tool names or a filter object.
            oneOf:
            - type: array
              title: MCP allowed tools
              description: A string array of allowed tool names
              items:
                type: string
            - $ref: "#/components/schemas/MCPToolFilter"
          - type: "null"
        allowed_callers:
          anyOf:
          - type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            description: The tool invocation context(s).
          - type: "null"
        require_approval:
          anyOf:
          - description: Specify which of the MCP server's tools require approval.
            oneOf:
            - type: object
              title: MCP tool approval filter
              description: >-
                Specify which of the MCP server's tools require approval. Can be `always`, `never`, or a filter object associated with tools that require approval.
              properties:
                always:
                  $ref: "#/components/schemas/MCPToolFilter"
                never:
                  $ref: "#/components/schemas/MCPToolFilter"
              additionalProperties: false
            - type: string
              title: MCP tool approval setting
              description: >-
                Specify a single approval policy for all tools. One of `always` or `never`. When set to `always`, all tools will require approval. When set to `never`, all tools will not require approval.
              enum:
              - always
              - never
            default: always
          - type: "null"
        defer_loading:
          type: boolean
          description: |-
            Whether this MCP tool is deferred and discovered via tool search.
      required:
      - type
      - server_label
    MCPToolFilter:
      type: object
      title: MCP tool filter
      description: |-
        A filter object to specify which tools are allowed.
      properties:
        tool_names:
          type: array
          title: MCP allowed tools
          items:
            type: string
          description: List of allowed tool names.
        read_only:
          type: boolean
          description: |-
            Indicates whether or not a tool modifies data or is read-only. If an MCP server is [annotated with `readOnlyHint`](https://modelcontextprotocol.io/specification/2025-06-18/schema#toolannotations-readonlyhint), it will match this filter.
      required: []
      additionalProperties: false
    MessagePhase:
      type: string
      description: >-
        Labels an `assistant` message as intermediate commentary (`commentary`) or the final answer (`final_answer`). For models like `gpt-5.3-codex` and beyond, when sending follow-up requests, preserve and resend phase on all assistant messages — dropping it can degrade performance. Not used for user messages.
      enum:
      - commentary
      - final_answer
    Metadata:
      anyOf:
      - type: object
        description: >-
          Set of 16 key-value pairs that can be attached to an object. This can be useful for storing additional information about the object in a structured format, and querying for objects via API or the dashboard.

          Keys are strings with a maximum length of 64 characters. Values are strings with a maximum length of 512 characters.
        additionalProperties:
          type: string
      - type: "null"
    NamespaceToolParam:
      properties:
        type:
          type: string
          enum:
          - namespace
          description: The type of the tool. Always `namespace`.
          default: namespace
          x-stainless-const: true
        name:
          type: string
          minLength: 1
          description: The namespace name used in tool calls (for example, `crm`).
        description:
          type: string
          description: A description of the namespace shown to the model.
        tools:
          items:
            oneOf:
            - $ref: "#/components/schemas/FunctionToolParam"
            - $ref: "#/components/schemas/CustomToolParam"
            description: A function or custom tool that belongs to a namespace.
            discriminator:
              propertyName: type
          type: array
          minItems: 1
          description: The function/custom tools available inside this namespace.
      type: object
      required:
      - type
      - name
      - description
      - tools
      title: Namespace
      description: Groups function/custom tools under a shared namespace.
    ProgrammaticToolCallingParam:
      properties:
        type:
          type: string
          enum:
          - programmatic_tool_calling
          description: The type of the tool. Always `programmatic_tool_calling`.
          default: programmatic_tool_calling
          x-stainless-const: true
      type: object
      required:
      - type
    PromptCacheBreakpointConfig:
      properties:
        mode:
          type: string
          enum:
          - explicit
          description: The breakpoint mode. Always `explicit`.
          default: explicit
          x-stainless-const: true
      type: object
      required:
      - mode
      title: Prompt cache breakpoint
      description: Marks the exact end of a reusable prompt prefix. The breakpoint inherits its TTL from the request's `prompt_cache_options.ttl`; the boundary is not rounded to a token block.
    RankerVersionType:
      type: string
      enum:
      - auto
      - default-2024-11-15
    RankingOptions:
      properties:
        ranker:
          $ref: "#/components/schemas/RankerVersionType"
          description: The ranker to use for the file search.
        score_threshold:
          type: number
          description: The score threshold for the file search, a number between 0 and 1. Numbers closer to 1 will attempt to return only the most relevant results, but may return fewer results.
        hybrid_search:
          $ref: "#/components/schemas/HybridSearchOptions"
          description: Weights that control how reciprocal rank fusion balances semantic embedding matches versus sparse keyword matches when hybrid search is enabled.
      type: object
      required: []
    ReasoningEffort:
      anyOf:
      - type: string
        enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
        default: medium
        description: >-
          Constrains effort on reasoning for reasoning models. Currently supported values are `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, and `max`. Reducing reasoning effort can result in faster responses and fewer tokens used on reasoning in a response. Not all reasoning models support every value. See the [reasoning guide](https://platform.openai.com/docs/guides/reasoning) for model-specific support.
      - type: "null"
    ResponseFormatJsonObject:
      type: object
      title: JSON object
      description: >-
        JSON object response format. An older method of generating JSON responses. Using `json_schema` is recommended for models that support it. Note that the model will not generate JSON without a system or user message instructing it to do so.
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_object`.
          enum:
          - json_object
          x-stainless-const: true
      required:
      - type
    ResponseFormatJsonSchema:
      type: object
      title: JSON schema
      description: |-
        JSON Schema response format. Used to generate structured JSON responses. Learn more about [Structured Outputs](/docs/guides/structured-outputs).
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_schema`.
          enum:
          - json_schema
          x-stainless-const: true
        json_schema:
          type: object
          title: JSON schema
          description: |-
            Structured Outputs configuration options, including a JSON Schema.
          properties:
            description:
              type: string
              description: >-
                A description of what the response format is for, used by the model to determine how to respond in the format.
            name:
              type: string
              description: >-
                The name of the response format. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
            schema:
              $ref: "#/components/schemas/ResponseFormatJsonSchemaSchema"
            strict:
              anyOf:
              - type: boolean
                default: false
                description: >-
                  Whether to enable strict schema adherence when generating the output. If set to true, the model will always follow the exact schema defined in the `schema` field. Only a subset of JSON Schema is supported when `strict` is `true`. To learn more, read the [Structured Outputs guide](/docs/guides/structured-outputs).
              - type: "null"
          required:
          - name
      required:
      - type
      - json_schema
    ResponseFormatJsonSchemaSchema:
      type: object
      title: JSON schema
      description: |-
        The schema for the response format, described as a JSON Schema object. Learn how to build JSON schemas [here](https://json-schema.org/).
      additionalProperties: true
    ResponseFormatText:
      type: object
      title: Text
      description: |-
        Default response format. Used to generate text responses.
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `text`.
          enum:
          - text
          x-stainless-const: true
      required:
      - type
    SearchContentType:
      type: string
      enum:
      - text
      - image
    SearchContextSize:
      type: string
      enum:
      - low
      - medium
      - high
    SkillReferenceParam:
      properties:
        type:
          type: string
          enum:
          - skill_reference
          description: References a skill created with the /v1/skills endpoint.
          default: skill_reference
          x-stainless-const: true
        skill_id:
          type: string
          maxLength: 64
          minLength: 1
          description: The ID of the referenced skill.
        version:
          type: string
          description: Optional skill version. Use a positive integer or 'latest'. Omit for default.
      type: object
      required:
      - type
      - skill_id
    TextResponseFormatConfiguration:
      description: >-
        An object specifying the format that the model must output.

        Configuring `{ "type": "json_schema" }` enables Structured Outputs,  which ensures the model will match your supplied JSON schema. Learn more in the  [Structured Outputs guide](/docs/guides/structured-outputs).

        The default format is `{ "type": "text" }` with no additional options.

        **Not recommended for gpt-4o and newer models:**

        Setting to `{ "type": "json_object" }` enables the older JSON mode, which ensures the message the model generates is valid JSON. Using `json_schema` is preferred for models that support it.
      oneOf:
      - $ref: "#/components/schemas/ResponseFormatText"
      - $ref: "#/components/schemas/TextResponseFormatJsonSchema"
      - $ref: "#/components/schemas/ResponseFormatJsonObject"
    TextResponseFormatJsonSchema:
      type: object
      title: JSON schema
      description: |-
        JSON Schema response format. Used to generate structured JSON responses. Learn more about [Structured Outputs](/docs/guides/structured-outputs).
      properties:
        type:
          type: string
          description: The type of response format being defined. Always `json_schema`.
          enum:
          - json_schema
          x-stainless-const: true
        description:
          type: string
          description: >-
            A description of what the response format is for, used by the model to determine how to respond in the format.
        name:
          type: string
          description: |-
            The name of the response format. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
        schema:
          $ref: "#/components/schemas/ResponseFormatJsonSchemaSchema"
        strict:
          anyOf:
          - type: boolean
            default: false
            description: >-
              Whether to enable strict schema adherence when generating the output. If set to true, the model will always follow the exact schema defined in the `schema` field. Only a subset of JSON Schema is supported when `strict` is `true`. To learn more, read the [Structured Outputs guide](/docs/guides/structured-outputs).
          - type: "null"
      required:
      - type
      - schema
      - name
    Tool:
      description: |-
        A tool that can be used to generate a response.
      discriminator:
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/FunctionTool"
      - $ref: "#/components/schemas/FileSearchTool"
      - $ref: "#/components/schemas/ComputerTool"
      - $ref: "#/components/schemas/ComputerUsePreviewTool"
      - $ref: "#/components/schemas/WebSearchTool"
      - $ref: "#/components/schemas/MCPTool"
      - $ref: "#/components/schemas/CodeInterpreterTool"
      - $ref: "#/components/schemas/ProgrammaticToolCallingParam"
      - $ref: "#/components/schemas/ImageGenTool"
      - $ref: "#/components/schemas/LocalShellToolParam"
      - $ref: "#/components/schemas/FunctionShellToolParam"
      - $ref: "#/components/schemas/CustomToolParam"
      - $ref: "#/components/schemas/NamespaceToolParam"
      - $ref: "#/components/schemas/ToolSearchToolParam"
      - $ref: "#/components/schemas/WebSearchPreviewTool"
      - $ref: "#/components/schemas/ApplyPatchToolParam"
    ToolSearchExecutionType:
      type: string
      enum:
      - server
      - client
    ToolSearchToolParam:
      properties:
        type:
          type: string
          enum:
          - tool_search
          description: The type of the tool. Always `tool_search`.
          default: tool_search
          x-stainless-const: true
        execution:
          $ref: "#/components/schemas/ToolSearchExecutionType"
          description: Whether tool search is executed by the server or by the client.
        description:
          anyOf:
          - type: string
            description: Description shown to the model for a client-executed tool search tool.
          - type: "null"
        parameters:
          anyOf:
          - $ref: "#/components/schemas/EmptyModelParam"
            description: Parameter schema for a client-executed tool search tool.
          - type: "null"
      type: object
      required:
      - type
      title: Tool search tool
      description: Hosted or BYOT tool search configuration for deferred tools.
    WebSearchApproximateLocation:
      anyOf:
      - type: object
        title: Web search approximate location
        description: |-
          The approximate location of the user.
        properties:
          type:
            type: string
            enum:
            - approximate
            description: The type of location approximation. Always `approximate`.
            default: approximate
            x-stainless-const: true
          country:
            anyOf:
            - type: string
              description: The two-letter [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the user, e.g. `US`.
            - type: "null"
          region:
            anyOf:
            - type: string
              description: Free text input for the region of the user, e.g. `California`.
            - type: "null"
          city:
            anyOf:
            - type: string
              description: Free text input for the city of the user, e.g. `San Francisco`.
            - type: "null"
          timezone:
            anyOf:
            - type: string
              description: The [IANA timezone](https://timeapi.io/documentation/iana-timezones) of the user, e.g. `America/Los_Angeles`.
            - type: "null"
      - type: "null"
    WebSearchPreviewTool:
      properties:
        type:
          type: string
          enum:
          - web_search_preview
          - web_search_preview_2025_03_11
          description: The type of the web search tool. One of `web_search_preview` or `web_search_preview_2025_03_11`.
          default: web_search_preview
          x-stainless-const: true
        user_location:
          anyOf:
          - $ref: "#/components/schemas/ApproximateLocation"
            description: The user's location.
          - type: "null"
        search_context_size:
          $ref: "#/components/schemas/SearchContextSize"
          description: High level guidance for the amount of context window space to use for the search. One of `low`, `medium`, or `high`. `medium` is the default.
        search_content_types:
          items:
            $ref: "#/components/schemas/SearchContentType"
          type: array
      type: object
      required:
      - type
      title: Web search preview
      description: This tool searches the web for relevant results to use in a response. Learn more about the [web search tool](https://platform.openai.com/docs/guides/tools-web-search).
    WebSearchTool:
      type: object
      title: Web search
      description: >-
        Search the Internet for sources related to the prompt. Learn more about the [web search tool](/docs/guides/tools-web-search).
      properties:
        type:
          type: string
          enum:
          - web_search
          - web_search_2025_08_26
          description: The type of the web search tool. One of `web_search` or `web_search_2025_08_26`.
          default: web_search
        filters:
          anyOf:
          - type: object
            description: |-
              Filters for the search.
            properties:
              allowed_domains:
                anyOf:
                - type: array
                  title: Allowed domains for the search.
                  description: >-
                    Allowed domains for the search. If not provided, all domains are allowed. Subdomains of the provided domains are allowed as well.

                    Example: `["pubmed.ncbi.nlm.nih.gov"]`
                  items:
                    type: string
                    description: Allowed domain for the search.
                  default: []
                - type: "null"
          - type: "null"
        user_location:
          $ref: "#/components/schemas/WebSearchApproximateLocation"
        search_context_size:
          type: string
          enum:
          - low
          - medium
          - high
