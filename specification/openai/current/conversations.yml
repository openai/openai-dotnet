openapi: 3.1.0
info:
  title: OpenAI API — Conversations
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Conversations
  description: Manage conversations and conversation items.
paths:
  /conversations/{conversation_id}/items:
    post:
      operationId: createConversationItems
      tags:
      - Conversations
      summary: Create items in a conversation with the given ID.
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          type: string
          example: conv_123
        description: The ID of the conversation to add the item to.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/IncludeEnum"
        description: |-
          Additional fields to include in the response. See the `include` parameter for [listing Conversation items above](/docs/api-reference/conversations/list-items#conversations_list_items-include) for more information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                items:
                  type: array
                  description: >-
                    The items to add to the conversation. You may add up to 20 items at a time.
                  items:
                    $ref: "#/components/schemas/InputItem"
                  maxItems: 20
              required:
              - items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationItemList"
    get:
      operationId: listConversationItems
      tags:
      - Conversations
      summary: List all items for a conversation with the given ID.
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          type: string
          example: conv_123
        description: The ID of the conversation to list items for.
      - name: limit
        in: query
        description: >-
          A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 20.
        required: false
        schema:
          type: integer
          default: 20
      - in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
        description: |-
          The order to return the input items in. Default is `desc`.
          - `asc`: Return the input items in ascending order.
          - `desc`: Return the input items in descending order.
      - in: query
        name: after
        schema:
          type: string
        description: |-
          An item ID to list items after, used in pagination.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/IncludeEnum"
        description: >-
          Specify additional output data to include in the model response. Currently supported values are:

          - `web_search_call.action.sources`: Include the sources of the web search tool call.

          - `code_interpreter_call.outputs`: Includes the outputs of python code execution in code interpreter tool call items.

          - `computer_call_output.output.image_url`: Include image urls from the computer call output.

          - `file_search_call.results`: Include the search results of the file search tool call.

          - `message.input_image.image_url`: Include image urls from the input message.

          - `message.output_text.logprobs`: Include logprobs with assistant messages.

          - `reasoning.encrypted_content`: Includes an encrypted version of reasoning tokens in reasoning item outputs. This enables reasoning items to be used in multi-turn conversations when using the Responses API statelessly (like when the `store` parameter is set to `false`, or when an organization is enrolled in the zero data retention program).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationItemList"
  /conversations/{conversation_id}/items/{item_id}:
    get:
      operationId: getConversationItem
      tags:
      - Conversations
      summary: Get a single item from a conversation with the given IDs.
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          type: string
          example: conv_123
        description: The ID of the conversation that contains the item.
      - in: path
        name: item_id
        required: true
        schema:
          type: string
          example: msg_abc
        description: The ID of the item to retrieve.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/IncludeEnum"
        description: |-
          Additional fields to include in the response. See the `include` parameter for [listing Conversation items above](/docs/api-reference/conversations/list-items#conversations_list_items-include) for more information.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationItem"
    delete:
      operationId: deleteConversationItem
      tags:
      - Conversations
      summary: Delete an item from a conversation with the given IDs.
      parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          type: string
          example: conv_123
        description: The ID of the conversation that contains the item.
      - in: path
        name: item_id
        required: true
        schema:
          type: string
          example: msg_abc
        description: The ID of the item to delete.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResource"
  /conversations:
    post:
      tags:
      - Conversations
      summary: Create a conversation.
      operationId: createConversation
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResource"
  /conversations/{conversation_id}:
    get:
      tags:
      - Conversations
      summary: Get a conversation
      operationId: getConversation
      parameters:
      - name: conversation_id
        in: path
        description: The ID of the conversation to retrieve.
        required: true
        schema:
          example: conv_123
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResource"
    delete:
      tags:
      - Conversations
      summary: Delete a conversation. Items in the conversation will not be deleted.
      operationId: deleteConversation
      parameters:
      - name: conversation_id
        in: path
        description: The ID of the conversation to delete.
        required: true
        schema:
          example: conv_123
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedConversationResource"
    post:
      tags:
      - Conversations
      summary: Update a conversation
      operationId: updateConversation
      parameters:
      - name: conversation_id
        in: path
        description: The ID of the conversation to update.
        required: true
        schema:
          example: conv_123
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationBody"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResource"
components:
  schemas:
    AdditionalTools:
      properties:
        type:
          type: string
          enum:
          - additional_tools
          description: The type of the item. Always `additional_tools`.
          default: additional_tools
          x-stainless-const: true
        id:
          type: string
          description: The unique ID of the additional tools item.
        role:
          $ref: "#/components/schemas/MessageRole"
          description: The role that provided the additional tools.
        tools:
          items:
            $ref: "#/components/schemas/Tool"
          type: array
          description: The additional tool definitions made available at this item.
      type: object
      required:
      - type
      - id
      - role
      - tools
    AdditionalToolsItemParam:
      properties:
        id:
          anyOf:
          - type: string
            description: The unique ID of this additional tools item.
            example: at_123
          - type: "null"
        type:
          type: string
          enum:
          - additional_tools
          description: The item type. Always `additional_tools`.
          default: additional_tools
          x-stainless-const: true
        role:
          type: string
          enum:
          - developer
          description: The role that provided the additional tools. Only `developer` is supported.
          default: developer
          x-stainless-const: true
        tools:
          items:
            $ref: "#/components/schemas/Tool"
          type: array
          description: A list of additional tools made available at this item.
      type: object
      required:
      - type
      - role
      - tools
    Annotation:
      oneOf:
      - $ref: "#/components/schemas/FileCitationBody"
      - $ref: "#/components/schemas/UrlCitationBody"
      - $ref: "#/components/schemas/ContainerFileCitationBody"
      - $ref: "#/components/schemas/FilePath"
      description: An annotation that applies to a span of output text.
      discriminator:
        propertyName: type
    ApplyPatchCallOutputStatus:
      type: string
      enum:
      - completed
      - failed
    ApplyPatchCallOutputStatusParam:
      type: string
      enum:
      - completed
      - failed
      title: Apply patch call output status
      description: Outcome values reported for apply_patch tool call outputs.
    ApplyPatchCallStatus:
      type: string
      enum:
      - in_progress
      - completed
    ApplyPatchCallStatusParam:
      type: string
      enum:
      - in_progress
      - completed
      title: Apply patch call status
      description: Status values reported for apply_patch tool calls.
    ApplyPatchCreateFileOperation:
      properties:
        type:
          type: string
          enum:
          - create_file
          description: Create a new file with the provided diff.
          default: create_file
          x-stainless-const: true
        path:
          type: string
          description: Path of the file to create.
        diff:
          type: string
          description: Diff to apply.
      type: object
      required:
      - type
      - path
      - diff
      title: Apply patch create file operation
      description: Instruction describing how to create a file via the apply_patch tool.
    ApplyPatchCreateFileOperationParam:
      properties:
        type:
          type: string
          enum:
          - create_file
          description: The operation type. Always `create_file`.
          default: create_file
          x-stainless-const: true
        path:
          type: string
          minLength: 1
          description: Path of the file to create relative to the workspace root.
        diff:
          type: string
          maxLength: 10485760
          description: Unified diff content to apply when creating the file.
      type: object
      required:
      - type
      - path
      - diff
      title: Apply patch create file operation
      description: Instruction for creating a new file via the apply_patch tool.
    ApplyPatchDeleteFileOperation:
      properties:
        type:
          type: string
          enum:
          - delete_file
          description: Delete the specified file.
          default: delete_file
          x-stainless-const: true
        path:
          type: string
          description: Path of the file to delete.
      type: object
      required:
      - type
      - path
      title: Apply patch delete file operation
      description: Instruction describing how to delete a file via the apply_patch tool.
    ApplyPatchDeleteFileOperationParam:
      properties:
        type:
          type: string
          enum:
          - delete_file
          description: The operation type. Always `delete_file`.
          default: delete_file
          x-stainless-const: true
        path:
          type: string
          minLength: 1
          description: Path of the file to delete relative to the workspace root.
      type: object
      required:
      - type
      - path
      title: Apply patch delete file operation
      description: Instruction for deleting an existing file via the apply_patch tool.
    ApplyPatchOperationParam:
      oneOf:
      - $ref: "#/components/schemas/ApplyPatchCreateFileOperationParam"
      - $ref: "#/components/schemas/ApplyPatchDeleteFileOperationParam"
      - $ref: "#/components/schemas/ApplyPatchUpdateFileOperationParam"
      title: Apply patch operation
      description: One of the create_file, delete_file, or update_file operations supplied to the apply_patch tool.
      discriminator:
        propertyName: type
    ApplyPatchToolCall:
      properties:
        type:
          type: string
          enum:
          - apply_patch_call
          description: The type of the item. Always `apply_patch_call`.
          default: apply_patch_call
          x-stainless-const: true
        id:
          type: string
          description: The unique ID of the apply patch tool call. Populated when this item is returned via API.
        call_id:
          type: string
          description: The unique ID of the apply patch tool call generated by the model.
        caller:
          anyOf:
          - $ref: "#/components/schemas/ToolCallCaller"
            description: The execution context that produced this tool call.
          - type: "null"
        status:
          $ref: "#/components/schemas/ApplyPatchCallStatus"
          description: The status of the apply patch tool call. One of `in_progress` or `completed`.
        operation:
          oneOf:
          - $ref: "#/components/schemas/ApplyPatchCreateFileOperation"
          - $ref: "#/components/schemas/ApplyPatchDeleteFileOperation"
          - $ref: "#/components/schemas/ApplyPatchUpdateFileOperation"
          title: Apply patch operation
          description: One of the create_file, delete_file, or update_file operations applied via apply_patch.
          discriminator:
            propertyName: type
        created_by:
          type: string
          description: The ID of the entity that created this tool call.
      type: object
      required:
      - type
      - id
      - call_id
      - status
      - operation
      title: Apply patch tool call
      description: A tool call that applies file diffs by creating, deleting, or updating files.
    ApplyPatchToolCallItemParam:
      properties:
        type:
          type: string
          enum:
          - apply_patch_call
          description: The type of the item. Always `apply_patch_call`.
          default: apply_patch_call
          x-stainless-const: true
        id:
          anyOf:
          - type: string
            description: The unique ID of the apply patch tool call. Populated when this item is returned via API.
            example: apc_123
          - type: "null"
        call_id:
          type: string
          maxLength: 64
          minLength: 1
          description: The unique ID of the apply patch tool call generated by the model.
        caller:
          anyOf:
          - $ref: "#/components/schemas/ToolCallCallerParam"
            description: The execution context that produced this tool call.
          - type: "null"
        status:
          $ref: "#/components/schemas/ApplyPatchCallStatusParam"
          description: The status of the apply patch tool call. One of `in_progress` or `completed`.
        operation:
          $ref: "#/components/schemas/ApplyPatchOperationParam"
          description: The specific create, delete, or update instruction for the apply_patch tool call.
      type: object
      required:
      - type
      - call_id
      - status
      - operation
      title: Apply patch tool call
      description: A tool call representing a request to create, delete, or update files using diff patches.
    ApplyPatchToolCallOutput:
      properties:
        type:
          type: string
          enum:
          - apply_patch_call_output
          description: The type of the item. Always `apply_patch_call_output`.
          default: apply_patch_call_output
          x-stainless-const: true
        id:
          type: string
          description: The unique ID of the apply patch tool call output. Populated when this item is returned via API.
        call_id:
          type: string
          description: The unique ID of the apply patch tool call generated by the model.
        caller:
          anyOf:
          - $ref: "#/components/schemas/ToolCallCaller"
            description: The execution context that produced this tool call.
          - type: "null"
        status:
          $ref: "#/components/schemas/ApplyPatchCallOutputStatus"
          description: The status of the apply patch tool call output. One of `completed` or `failed`.
        output:
          anyOf:
          - type: string
            description: Optional textual output returned by the apply patch tool.
          - type: "null"
        created_by:
          type: string
          description: The ID of the entity that created this tool call output.
      type: object
      required:
      - type
      - id
      - call_id
      - status
      title: Apply patch tool call output
      description: The output emitted by an apply patch tool call.
    ApplyPatchToolCallOutputItemParam:
      properties:
        type:
          type: string
          enum:
          - apply_patch_call_output
          description: The type of the item. Always `apply_patch_call_output`.
          default: apply_patch_call_output
          x-stainless-const: true
        id:
          anyOf:
          - type: string
            description: The unique ID of the apply patch tool call output. Populated when this item is returned via API.
            example: apco_123
          - type: "null"
        call_id:
          type: string
          maxLength: 64
          minLength: 1
          description: The unique ID of the apply patch tool call generated by the model.
        caller:
          anyOf:
          - $ref: "#/components/schemas/ToolCallCallerParam"
            description: The execution context that produced this tool call.
          - type: "null"
        status:
          $ref: "#/components/schemas/ApplyPatchCallOutputStatusParam"
          description: The status of the apply patch tool call output. One of `completed` or `failed`.
        output:
          anyOf:
          - type: string
            maxLength: 10485760
            description: Optional human-readable log text from the apply patch tool (e.g., patch results or errors).
          - type: "null"
      type: object
      required:
      - type
      - call_id
      - status
      title: Apply patch tool call output
      description: The streamed output emitted by an apply patch tool call.
    ApplyPatchToolParam:
      properties:
        type:
          type: string
          enum:
          - apply_patch
          description: The type of the tool. Always `apply_patch`.
          default: apply_patch
          x-stainless-const: true
        allowed_callers:
          anyOf:
          - items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            type: array
            minItems: 1
            description: The tool invocation context(s).
          - type: "null"
      type: object
      required:
      - type
      title: Apply patch tool
      description: Allows the assistant to create, delete, or update files using unified diffs.
    ApplyPatchUpdateFileOperation:
      properties:
        type:
          type: string
          enum:
          - update_file
          description: Update an existing file with the provided diff.
          default: update_file
          x-stainless-const: true
        path:
          type: string
          description: Path of the file to update.
        diff:
          type: string
          description: Diff to apply.
      type: object
      required:
      - type
      - path
      - diff
      title: Apply patch update file operation
      description: Instruction describing how to update a file via the apply_patch tool.
    ApplyPatchUpdateFileOperationParam:
      properties:
        type:
          type: string
          enum:
          - update_file
          description: The operation type. Always `update_file`.
          default: update_file
          x-stainless-const: true
        path:
          type: string
          minLength: 1
          description: Path of the file to update relative to the workspace root.
        diff:
          type: string
          maxLength: 10485760
          description: Unified diff content to apply to the existing file.
      type: object
      required:
      - type
      - path
      - diff
      title: Apply patch update file operation
      description: Instruction for updating an existing file via the apply_patch tool.
    ApproximateLocation:
      properties:
        type:
          type: string
          enum:
          - approximate
          description: The type of location approximation. Always `approximate`.
          default: approximate
          x-stainless-const: true
        country:
          anyOf:
          - type: string
            description: The two-letter [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the user, e.g. `US`.
          - type: "null"
        region:
          anyOf:
          - type: string
            description: Free text input for the region of the user, e.g. `California`.
          - type: "null"
        city:
          anyOf:
          - type: string
            description: Free text input for the city of the user, e.g. `San Francisco`.
          - type: "null"
        timezone:
          anyOf:
          - type: string
            description: The [IANA timezone](https://timeapi.io/documentation/iana-timezones) of the user, e.g. `America/Los_Angeles`.
          - type: "null"
      type: object
      required:
      - type
    AutoCodeInterpreterToolParam:
      properties:
        type:
          type: string
          enum:
          - auto
          description: Always `auto`.
          default: auto
          x-stainless-const: true
        file_ids:
          items:
            type: string
            example: file-123
          type: array
          maxItems: 50
          description: An optional list of uploaded files to make available to your code.
        memory_limit:
          anyOf:
          - $ref: "#/components/schemas/ContainerMemoryLimit"
            description: The memory limit for the code interpreter container.
          - type: "null"
        network_policy:
          oneOf:
          - $ref: "#/components/schemas/ContainerNetworkPolicyDisabledParam"
          - $ref: "#/components/schemas/ContainerNetworkPolicyAllowlistParam"
          description: Network access policy for the container.
          discriminator:
            propertyName: type
      type: object
      required:
      - type
      title: CodeInterpreterToolAuto
      description: Configuration for a code interpreter container. Optionally specify the IDs of the files to run the code on.
    CallableToolAllowedCaller:
      type: string
      enum:
      - direct
      - programmatic
    ClickButtonType:
      type: string
      enum:
      - left
      - right
      - wheel
      - back
      - forward
    ClickParam:
      properties:
        type:
          type: string
          enum:
          - click
          description: Specifies the event type. For a click action, this property is always `click`.
          default: click
          x-stainless-const: true
        button:
          $ref: "#/components/schemas/ClickButtonType"
          description: Indicates which mouse button was pressed during the click. One of `left`, `right`, `wheel`, `back`, or `forward`.
        x:
          type: integer
          description: The x-coordinate where the click occurred.
        y:
          type: integer
          description: The y-coordinate where the click occurred.
        keys:
          anyOf:
          - items:
              type: string
            type: array
            description: The keys being held while clicking.
          - type: "null"
      type: object
      required:
      - type
      - button
      - x
      - y
      title: Click
      description: A click action.
    CodeInterpreterOutputImage:
      properties:
        type:
          type: string
          enum:
          - image
          description: The type of the output. Always `image`.
          default: image
          x-stainless-const: true
        url:
          type: string
          format: uri
          description: The URL of the image output from the code interpreter.
      type: object
      required:
      - type
      - url
      title: Code interpreter output image
      description: The image output from the code interpreter.
    CodeInterpreterOutputLogs:
      properties:
        type:
          type: string
          enum:
          - logs
          description: The type of the output. Always `logs`.
          default: logs
          x-stainless-const: true
        logs:
          type: string
          description: The logs output from the code interpreter.
      type: object
      required:
      - type
      - logs
      title: Code interpreter output logs
      description: The logs output from the code interpreter.
    CodeInterpreterTool:
      type: object
      title: Code interpreter
      description: |-
        A tool that runs Python code to help generate a response to a prompt.
      properties:
        type:
          type: string
          enum:
          - code_interpreter
          description: |-
            The type of the code interpreter tool. Always `code_interpreter`.
          x-stainless-const: true
        container:
          description: >-
            The code interpreter container. Can be a container ID or an object that specifies uploaded file IDs to make available to your code, along with an optional `memory_limit` setting.
          oneOf:
          - type: string
            description: The container ID.
          - $ref: "#/components/schemas/AutoCodeInterpreterToolParam"
        allowed_callers:
          anyOf:
          - type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/CallableToolAllowedCaller"
            description: The tool invocation context(s).
          - type: "null"
      required:
      - type
      - container
    CodeInterpreterToolCall:
      type: object
      title: Code interpreter tool call
      description: |-
        A tool call to run code.
      properties:
        type:
          type: string
          enum:
          - code_interpreter_call
          default: code_interpreter_call
          x-stainless-const: true
          description: >-
            The type of the code interpreter tool call. Always `code_interpreter_call`.
        id:
          type: string
          description: |-
            The unique ID of the code interpreter tool call.
        status:
          type: string
          enum:
          - in_progress
          - completed
          - incomplete
          - interpreting
          - failed
          description: >-
            The status of the code interpreter tool call. Valid values are `in_progress`, `completed`, `incomplete`, `interpreting`, and `failed`.
        container_id:
          type: string
          description: |-
            The ID of the container used to run the code.
        code:
          anyOf:
          - type: string
            description: |-
              The code to run, or null if not available.
          - type: "null"
        outputs:
          anyOf:
          - type: array
            items:
              oneOf:
              - $ref: "#/components/schemas/CodeInterpreterOutputLogs"
              - $ref: "#/components/schemas/CodeInterpreterOutputImage"
              discriminator:
                propertyName: type
            discriminator:
              propertyName: type
            description: >-
