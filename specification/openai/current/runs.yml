          minimum: 0
          maximum: 1
      required:
      - ranker
      - score_threshold
    RunStepDetailsToolCallsFileSearchResultObject:
      title: File search tool call result
      type: object
      description: A result instance of the file search.
      properties:
        file_id:
          type: string
          description: The ID of the file that result was found in.
        file_name:
          type: string
          description: The name of the file that result was found in.
        score:
          type: number
          description: The score of the result. All values must be a floating point number between 0 and 1.
          minimum: 0
          maximum: 1
        content:
          type: array
          description: The content of the result that was found. The content is only included if requested via the include query parameter.
          items:
            type: object
            properties:
              type:
                type: string
                description: The type of the content.
                enum:
                - text
                x-stainless-const: true
              text:
                type: string
                description: The text content of the file.
      required:
      - file_id
      - file_name
      - score
    RunStepDetailsToolCallsFunctionObject:
      type: object
      title: Function tool call
      properties:
        id:
          type: string
          description: The ID of the tool call object.
        type:
          type: string
          description: The type of tool call. This is always going to be `function` for this type of tool call.
          enum:
          - function
          x-stainless-const: true
        function:
          type: object
          description: The definition of the function that was called.
          properties:
            name:
              type: string
              description: The name of the function.
            arguments:
              type: string
              description: The arguments passed to the function.
            output:
              anyOf:
              - type: string
                description: The output of the function. This will be `null` if the outputs have not been [submitted](/docs/api-reference/runs/submitToolOutputs) yet.
              - type: "null"
          required:
          - name
          - arguments
          - output
      required:
      - id
      - type
      - function
    RunStepDetailsToolCallsObject:
      title: Tool calls
      type: object
      description: Details of the tool call.
      properties:
        type:
          description: Always `tool_calls`.
          type: string
          enum:
          - tool_calls
          x-stainless-const: true
        tool_calls:
          type: array
          description: >-
            An array of tool calls the run step was involved in. These can be associated with one of three types of tools: `code_interpreter`, `file_search`, or `function`.
          items:
            oneOf:
            - $ref: "#/components/schemas/RunStepDetailsToolCallsCodeObject"
            - $ref: "#/components/schemas/RunStepDetailsToolCallsFileSearchObject"
            - $ref: "#/components/schemas/RunStepDetailsToolCallsFunctionObject"
      required:
      - type
      - tool_calls
    RunStepObject:
      type: object
      title: Run steps
      description: |-
        Represents a step in execution of a run.
      properties:
        id:
          description: The identifier of the run step, which can be referenced in API endpoints.
          type: string
        object:
          description: The object type, which is always `thread.run.step`.
          type: string
          enum:
          - thread.run.step
          x-stainless-const: true
        created_at:
          description: The Unix timestamp (in seconds) for when the run step was created.
          type: integer
          format: unixtime
        assistant_id:
          description: The ID of the [assistant](/docs/api-reference/assistants) associated with the run step.
          type: string
        thread_id:
          description: The ID of the [thread](/docs/api-reference/threads) that was run.
          type: string
        run_id:
          description: The ID of the [run](/docs/api-reference/runs) that this run step is a part of.
          type: string
        type:
          description: The type of run step, which can be either `message_creation` or `tool_calls`.
          type: string
          enum:
          - message_creation
          - tool_calls
        status:
          description: The status of the run step, which can be either `in_progress`, `cancelled`, `failed`, `completed`, or `expired`.
          type: string
          enum:
          - in_progress
          - cancelled
          - failed
          - completed
          - expired
        step_details:
          type: object
          description: The details of the run step.
          oneOf:
          - $ref: "#/components/schemas/RunStepDetailsMessageCreationObject"
          - $ref: "#/components/schemas/RunStepDetailsToolCallsObject"
        last_error:
          anyOf:
          - type: object
            description: The last error associated with this run step. Will be `null` if there are no errors.
            properties:
              code:
                type: string
                description: One of `server_error` or `rate_limit_exceeded`.
                enum:
                - server_error
                - rate_limit_exceeded
              message:
                type: string
                description: A human-readable description of the error.
            required:
            - code
            - message
          - type: "null"
        expired_at:
          anyOf:
          - description: The Unix timestamp (in seconds) for when the run step expired. A step is considered expired if the parent run is expired.
            type: integer
            format: unixtime
          - type: "null"
        cancelled_at:
          anyOf:
          - description: The Unix timestamp (in seconds) for when the run step was cancelled.
            type: integer
            format: unixtime
          - type: "null"
        failed_at:
          anyOf:
          - description: The Unix timestamp (in seconds) for when the run step failed.
            type: integer
            format: unixtime
          - type: "null"
        completed_at:
          anyOf:
          - description: The Unix timestamp (in seconds) for when the run step completed.
            type: integer
            format: unixtime
          - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
        usage:
          $ref: "#/components/schemas/RunStepCompletionUsage"
      required:
      - id
      - object
      - created_at
      - assistant_id
      - thread_id
      - run_id
      - type
      - status
      - step_details
      - last_error
      - expired_at
      - cancelled_at
      - failed_at
      - completed_at
      - metadata
      - usage
    RunToolCallObject:
      type: object
      description: Tool call objects
      properties:
        id:
          type: string
          description: The ID of the tool call. This ID must be referenced when you submit the tool outputs in using the [Submit tool outputs to run](/docs/api-reference/runs/submitToolOutputs) endpoint.
        type:
          type: string
          description: The type of tool call the output is required for. For now, this is always `function`.
          enum:
          - function
          x-stainless-const: true
        function:
          type: object
          description: The function definition.
          properties:
            name:
              type: string
              description: The name of the function.
            arguments:
              type: string
              description: The arguments that the model expects you to pass to the function.
          required:
          - name
          - arguments
      required:
      - id
      - type
      - function
    SubmitToolOutputsRunRequest:
      type: object
      additionalProperties: false
      properties:
        tool_outputs:
          description: A list of tools for which the outputs are being submitted.
          type: array
          items:
            type: object
            properties:
              tool_call_id:
                type: string
                description: The ID of the tool call in the `required_action` object within the run object the output is being submitted for.
              output:
                type: string
                description: The output of the tool call to be submitted to continue the run.
        stream:
          anyOf:
          - type: boolean
            description: >-
              If `true`, returns a stream of events that happen during the Run as server-sent events, terminating when the Run enters a terminal state with a `data: [DONE]` message.
          - type: "null"
      required:
      - tool_outputs
    TruncationObject:
      type: object
      title: Thread Truncation Controls
      description: Controls for how a thread will be truncated prior to the run. Use this to control the initial context window of the run.
      properties:
        type:
          type: string
          description: The truncation strategy to use for the thread. The default is `auto`. If set to `last_messages`, the thread will be truncated to the n most recent messages in the thread. When set to `auto`, messages in the middle of the thread will be dropped to fit the context length of the model, `max_prompt_tokens`.
          enum:
          - auto
          - last_messages
        last_messages:
          anyOf:
          - type: integer
            description: The number of most recent messages from the thread when constructing the context for the run.
            minimum: 1
          - type: "null"
      required:
      - type
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
