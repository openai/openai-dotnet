    CreateChatCompletionRequest:
      allOf:
      - $ref: "#/components/schemas/CreateModelResponseProperties"
      - type: object
        properties:
          messages:
            description: >-
              A list of messages comprising the conversation so far. Depending on the [model](/docs/models) you use, different message types (modalities) are supported, like [text](/docs/guides/text-generation), [images](/docs/guides/vision), and [audio](/docs/guides/audio).
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/ChatCompletionRequestMessage"
          model:
            description: >-
              Model ID used to generate the response, like `gpt-4o` or `o3`. OpenAI offers a wide range of models with different capabilities, performance characteristics, and price points. Refer to the [model guide](/docs/models) to browse and compare available models.
            $ref: "#/components/schemas/ModelIdsShared"
          modalities:
            $ref: "#/components/schemas/ResponseModalities"
          verbosity:
            $ref: "#/components/schemas/Verbosity"
          reasoning_effort:
            $ref: "#/components/schemas/ReasoningEffort"
          max_completion_tokens:
            description: >-
              An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and [reasoning tokens](/docs/guides/reasoning).
            type: integer
            nullable: true
          frequency_penalty:
            type: number
            default: 0
            minimum: -2
            maximum: 2
            nullable: true
            description: >-
              Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
          presence_penalty:
            type: number
            default: 0
            minimum: -2
            maximum: 2
            nullable: true
            description: >-
              Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.
          web_search_options:
            type: object
            title: Web search
            description: >-
              This tool searches the web for relevant results to use in a response. Learn more about the [web search tool](/docs/guides/tools-web-search?api-mode=chat).
            properties:
              user_location:
                type: object
                nullable: true
                required:
                - type
                - approximate
                description: |-
                  Approximate location parameters for the search.
                properties:
                  type:
                    type: string
                    description: >-
                      The type of location approximation. Always `approximate`.
                    enum:
                    - approximate
                    x-stainless-const: true
                  approximate:
                    $ref: "#/components/schemas/WebSearchLocation"
              search_context_size:
                $ref: "#/components/schemas/WebSearchContextSize"
          top_logprobs:
            description: >-
              An integer between 0 and 20 specifying the maximum number of most likely tokens to return at each token position, each with an associated log probability. In some cases, the number of returned tokens may be fewer than requested. `logprobs` must be set to `true` if this parameter is used.
            type: integer
            minimum: 0
            maximum: 20
            nullable: true
          response_format:
            description: >-
              An object specifying the format that the model must output.

              Setting to `{ "type": "json_schema", "json_schema": {...} }` enables Structured Outputs which ensures the model will match your supplied JSON schema. Learn more in the [Structured Outputs guide](/docs/guides/structured-outputs).

              Setting to `{ "type": "json_object" }` enables the older JSON mode, which ensures the message the model generates is valid JSON. Using `json_schema` is preferred for models that support it.
            oneOf:
            - $ref: "#/components/schemas/ResponseFormatText"
            - $ref: "#/components/schemas/ResponseFormatJsonSchema"
            - $ref: "#/components/schemas/ResponseFormatJsonObject"
            discriminator:
              propertyName: type
          audio:
            type: object
            nullable: true
            description: >-
              Parameters for audio output. Required when audio output is requested with `modalities: ["audio"]`. [Learn more](/docs/guides/audio).
            required:
            - voice
            - format
            properties:
              voice:
                $ref: "#/components/schemas/VoiceIdsOrCustomVoice"
                description: >-
                  The voice the model uses to respond. Supported built-in voices are `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`, `nova`, `onyx`, `sage`, `shimmer`, `marin`, and `cedar`. You may also provide a custom voice object with an `id`, for example `{ "id": "voice_1234" }`.
              format:
                type: string
                enum:
                - wav
                - aac
                - mp3
                - flac
                - opus
                - pcm16
                description: >-
                  Specifies the output audio format. Must be one of `wav`, `mp3`, `flac`, `opus`, or `pcm16`.
          store:
            type: boolean
            default: false
            nullable: true
            description: >-
              Whether or not to store the output of this chat completion request for use in our [model distillation](/docs/guides/distillation) or [evals](/docs/guides/evals) products.

              Supports text and image inputs. Note: image inputs over 8MB will be dropped.
          moderation:
            anyOf:
            - $ref: "#/components/schemas/ModerationParam"
              description: >-
                Configuration for running moderation on the request input and generated output.
            - type: "null"
          stream:
            description: |-
              If set to true, the model response data will be streamed to the client as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format). See the [Streaming section below](/docs/api-reference/chat/streaming) for more information, along with the [streaming responses](/docs/guides/streaming-responses) guide for more information on how to handle the streaming events.
            type: boolean
            nullable: true
            default: false
          stop:
            $ref: "#/components/schemas/StopConfiguration"
          logit_bias:
            type: object
            default: null
            nullable: true
            additionalProperties:
              type: integer
            description: >-
              Modify the likelihood of specified tokens appearing in the completion.

              Accepts a JSON object that maps tokens (specified by their token ID in the tokenizer) to an associated bias value from -100 to 100. Mathematically, the bias is added to the logits generated by the model prior to sampling. The exact effect will vary per model, but values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.
          logprobs:
            description: >-
              Whether to return log probabilities of the output tokens or not. If true, returns the log probabilities of each output token returned in the `content` of `message`.
            type: boolean
            default: false
            nullable: true
          max_tokens:
            description: >-
              The maximum number of [tokens](/tokenizer) that can be generated in the chat completion. This value can be used to control [costs](https://openai.com/api/pricing/) for text generated via API.

              This value is now deprecated in favor of `max_completion_tokens`, and is not compatible with [o-series models](/docs/guides/reasoning).
            type: integer
            nullable: true
            deprecated: true
          n:
            type: integer
            minimum: 1
            maximum: 128
            default: 1
            example: 1
            nullable: true
            description: How many chat completion choices to generate for each input message. Note that you will be charged based on the number of generated tokens across all of the choices. Keep `n` as `1` to minimize costs.
          prediction:
            nullable: true
            description: >-
              Configuration for a [Predicted Output](/docs/guides/predicted-outputs), which can greatly improve response times when large parts of the model response are known ahead of time. This is most common when you are regenerating a file with only minor changes to most of the content.
            oneOf:
            - $ref: "#/components/schemas/PredictionContent"
          seed:
            type: integer
            minimum: -9223372036854776000
            maximum: 9223372036854776000
            nullable: true
            deprecated: true
            description: >-
              This feature is in Beta. If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result. Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.
          stream_options:
            $ref: "#/components/schemas/ChatCompletionStreamOptions"
          tools:
            type: array
            description: |-
              A list of tools the model may call. You can provide either [custom tools](/docs/guides/function-calling#custom-tools) or [function tools](/docs/guides/function-calling).
            items:
              oneOf:
              - $ref: "#/components/schemas/ChatCompletionTool"
              - $ref: "#/components/schemas/CustomToolChatCompletions"
          tool_choice:
            $ref: "#/components/schemas/ChatCompletionToolChoiceOption"
          parallel_tool_calls:
            $ref: "#/components/schemas/ParallelToolCalls"
          function_call:
            deprecated: true
            description: >-
              Deprecated in favor of `tool_choice`.

              Controls which (if any) function is called by the model.

              `none` means the model will not call a function and instead generates a message.

              `auto` means the model can pick between generating a message or calling a function.

              Specifying a particular function via `{"name": "my_function"}` forces the model to call that function.

              `none` is the default when no functions are present. `auto` is the default if functions are present.
            oneOf:
            - type: string
              description: >-
                `none` means the model will not call a function and instead generates a message. `auto` means the model can pick between generating a message or calling a function.
              enum:
              - none
              - auto
            - $ref: "#/components/schemas/ChatCompletionFunctionCallOption"
          functions:
            deprecated: true
            description: |-
              Deprecated in favor of `tools`.
              A list of functions the model may generate JSON inputs for.
            type: array
            minItems: 1
            maxItems: 128
            items:
              $ref: "#/components/schemas/ChatCompletionFunctions"
        required:
        - model
        - messages
    CreateChatCompletionResponse:
      type: object
      description: Represents a chat completion response returned by model, based on the provided input.
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          description: A list of chat completion choices. Can be more than one if `n` is greater than 1.
          items:
            type: object
            required:
            - finish_reason
            - index
            - message
            - logprobs
