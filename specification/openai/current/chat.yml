openapi: 3.1.0
info:
  title: OpenAI API — Chat
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Chat
  description: Given a list of messages comprising a conversation, the model will return a response.
paths:
  /chat/completions:
    get:
      operationId: listChatCompletions
      tags:
      - Chat
      summary: >-
        List stored Chat Completions. Only Chat Completions that have been stored with the `store` parameter set to `true` will be returned.
      parameters:
      - name: model
        in: query
        description: The model used to generate the Chat Completions.
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: |-
          A list of metadata keys to filter the Chat Completions by. Example:
          `metadata[key1]=value1&metadata[key2]=value2`
        required: false
        schema:
          $ref: "#/components/schemas/Metadata"
      - name: after
        in: query
        description: Identifier for the last chat completion from the previous pagination request.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of Chat Completions to retrieve.
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        description: Sort order for Chat Completions by timestamp. Use `asc` for ascending order or `desc` for descending order. Defaults to `asc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        "200":
          description: A list of Chat Completions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionList"
    post:
      operationId: createChatCompletion
      tags:
      - Chat
      summary: |-
        **Starting a new project?** We recommend trying [Responses](/docs/api-reference/responses) to take advantage of the latest OpenAI platform features. Compare [Chat Completions with Responses](/docs/guides/responses-vs-chat-completions?api-mode=responses).
        ---
        Creates a model response for the given chat conversation. Learn more in the [text generation](/docs/guides/text-generation), [vision](/docs/guides/vision), and [audio](/docs/guides/audio) guides.
        Parameter support can differ depending on the model used to generate the response, particularly for newer reasoning models. Parameters that are only supported for reasoning models are noted below. For the current state of unsupported parameters in reasoning models, [refer to the reasoning guide](/docs/guides/reasoning).
        Returns a chat completion object, or a streamed sequence of chat completion chunk objects if the request is streamed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatCompletionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionStreamResponse"
  /chat/completions/{completion_id}:
    get:
      operationId: getChatCompletion
      tags:
      - Chat
      summary: >-
        Get a stored chat completion. Only Chat Completions that have been created with the `store` parameter set to `true` will be returned.
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
        description: The ID of the chat completion to retrieve.
      responses:
        "200":
          description: A chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
    post:
      operationId: updateChatCompletion
      tags:
      - Chat
      summary: >-
        Modify a stored chat completion. Only Chat Completions that have been created with the `store` parameter set to `true` can be modified. Currently, the only supported modification is to update the `metadata` field.
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
        description: The ID of the chat completion to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - metadata
              properties:
                metadata:
                  $ref: "#/components/schemas/Metadata"
      responses:
        "200":
          description: A chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
    delete:
      operationId: deleteChatCompletion
      tags:
      - Chat
      summary: |-
        Delete a stored chat completion. Only Chat Completions that have been created with the `store` parameter set to `true` can be deleted.
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
        description: The ID of the chat completion to delete.
      responses:
        "200":
          description: The chat completion was deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionDeleted"
  /chat/completions/{completion_id}/messages:
    get:
      operationId: getChatCompletionMessages
      tags:
      - Chat
      summary: |-
        Get the messages in a stored chat completion. Only Chat Completions that have been created with the `store` parameter set to `true` will be returned.
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
        description: The ID of the chat completion to retrieve messages from.
      - name: after
        in: query
        description: Identifier for the last message from the previous pagination request.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of messages to retrieve.
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        description: Sort order for messages by timestamp. Use `asc` for ascending order or `desc` for descending order. Defaults to `asc`.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        "200":
          description: A list of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionMessageList"
components:
  schemas:
    ChatCompletionAllowedTools:
      type: object
      title: Allowed tools
      description: |-
        Constrains the tools available to the model to a pre-defined set.
      properties:
        mode:
          type: string
          enum:
          - auto
          - required
          description: >-
            Constrains the tools available to the model to a pre-defined set.

            `auto` allows the model to pick from among the allowed tools and generate a message.

            `required` requires the model to call one or more of the allowed tools.
        tools:
          type: array
          description: >-
            A list of tool definitions that the model should be allowed to call.

            For the Chat Completions API, the list of tool definitions might look like: ```json [   { "type": "function", "function": { "name": "get_weather" } },   { "type": "function", "function": { "name": "get_time" } } ] ```
          items:
            type: object
            x-oaiExpandable: false
            description: |-
              A tool definition that the model should be allowed to call.
            additionalProperties: true
      required:
      - mode
      - tools
    ChatCompletionAllowedToolsChoice:
      type: object
      title: Allowed tools
      description: |-
        Constrains the tools available to the model to a pre-defined set.
      properties:
        type:
          type: string
          enum:
          - allowed_tools
          description: Allowed tool configuration type. Always `allowed_tools`.
          x-stainless-const: true
        allowed_tools:
          $ref: "#/components/schemas/ChatCompletionAllowedTools"
      required:
      - type
      - allowed_tools
    ChatCompletionDeleted:
      type: object
      properties:
        object:
          type: string
          description: The type of object being deleted.
          enum:
          - chat.completion.deleted
          x-stainless-const: true
        id:
          type: string
          description: The ID of the chat completion that was deleted.
        deleted:
          type: boolean
          description: Whether the chat completion was deleted.
      required:
      - object
      - id
      - deleted
    ChatCompletionFunctionCallOption:
      type: object
      description: >-
        Specifying a particular function via `{"name": "my_function"}` forces the model to call that function.
      properties:
        name:
          type: string
          description: The name of the function to call.
      required:
      - name
    ChatCompletionFunctions:
      type: object
      deprecated: true
      properties:
        description:
          type: string
          description: A description of what the function does, used by the model to choose when and how to call the function.
        name:
          type: string
          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
        parameters:
          $ref: "#/components/schemas/FunctionParameters"
      required:
      - name
    ChatCompletionList:
      type: object
      title: ChatCompletionList
      description: |-
        An object representing a list of Chat Completions.
      properties:
        object:
          type: string
          enum:
          - list
          default: list
          description: |-
            The type of this object. It is always set to "list".
          x-stainless-const: true
        data:
          type: array
          description: |-
            An array of chat completion objects.
          items:
            $ref: "#/components/schemas/CreateChatCompletionResponse"
        first_id:
          type: string
          description: The identifier of the first chat completion in the data array.
        last_id:
          type: string
          description: The identifier of the last chat completion in the data array.
        has_more:
          type: boolean
          description: Indicates whether there are more Chat Completions available.
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    ChatCompletionMessageCustomToolCall:
      type: object
      title: Custom tool call
      description: |-
        A call to a custom tool created by the model.
      properties:
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          enum:
          - custom
          description: The type of the tool. Always `custom`.
          x-stainless-const: true
        custom:
          type: object
          description: The custom tool that the model called.
          properties:
            name:
              type: string
              description: The name of the custom tool to call.
            input:
              type: string
              description: The input for the custom tool call generated by the model.
          required:
          - name
          - input
      required:
      - id
      - type
      - custom
    ChatCompletionMessageList:
      type: object
      title: ChatCompletionMessageList
      description: |-
        An object representing a list of chat completion messages.
      properties:
        object:
          type: string
          enum:
          - list
          default: list
          description: |-
            The type of this object. It is always set to "list".
          x-stainless-const: true
        data:
          type: array
          description: |-
            An array of chat completion message objects.
          items:
            allOf:
            - $ref: "#/components/schemas/ChatCompletionResponseMessage"
            - type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: The identifier of the chat message.
                content_parts:
                  anyOf:
                  - type: array
                    description: >-
                      If a content parts array was provided, this is an array of `text` and `image_url` parts. Otherwise, null.
                    items:
                      oneOf:
                      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
                      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartImage"
                  - type: "null"
        first_id:
          type: string
          description: The identifier of the first chat message in the data array.
        last_id:
          type: string
          description: The identifier of the last chat message in the data array.
        has_more:
          type: boolean
          description: Indicates whether there are more chat messages available.
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    ChatCompletionMessageToolCall:
      type: object
      title: Function tool call
      description: |-
        A call to a function tool created by the model.
      properties:
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
          x-stainless-const: true
        function:
          type: object
          description: The function that the model called.
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
          required:
          - name
          - arguments
      required:
      - id
      - type
      - function
    ChatCompletionMessageToolCallChunk:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
          description: The ID of the tool call.
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only `function` is supported.
          x-stainless-const: true
        function:
          type: object
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
      required:
      - index
    ChatCompletionMessageToolCalls:
      type: array
      description: The tool calls generated by the model, such as function calls.
      items:
        oneOf:
        - $ref: "#/components/schemas/ChatCompletionMessageToolCall"
        - $ref: "#/components/schemas/ChatCompletionMessageCustomToolCall"
        discriminator:
          propertyName: type
    ChatCompletionModeration:
      type: object
      description: Moderation results or errors for the request input and generated output.
      properties:
        input:
          oneOf:
          - $ref: "#/components/schemas/ChatCompletionModerationResults"
          - $ref: "#/components/schemas/ChatCompletionModerationError"
          discriminator:
            propertyName: type
          description: Moderation for the request input.
        output:
          oneOf:
          - $ref: "#/components/schemas/ChatCompletionModerationResults"
          - $ref: "#/components/schemas/ChatCompletionModerationError"
          discriminator:
            propertyName: type
          description: Moderation for the generated output.
      required:
      - input
      - output
    ChatCompletionModerationError:
      type: object
      description: An error produced while attempting moderation.
      properties:
        type:
          type: string
          enum:
          - error
          description: The object type, which is always `error`.
          x-stainless-const: true
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
      required:
      - type
      - code
      - message
    ChatCompletionModerationResults:
      type: object
      description: Successful moderation results for the request input or generated output.
      properties:
        type:
          type: string
          enum:
          - moderation_results
          description: The object type, which is always `moderation_results`.
          x-stainless-const: true
        model:
          type: string
          description: The moderation model used to generate the results.
        results:
          type: array
          description: A list of moderation results.
          items:
            $ref: "#/components/schemas/ModerationResultBody"
      required:
      - type
      - model
      - results
    ChatCompletionNamedToolChoice:
      type: object
      title: Function tool choice
      description: Specifies a tool the model should use. Use to force the model to call a specific function.
      properties:
        type:
          type: string
          enum:
          - function
          description: For function calling, the type is always `function`.
          x-stainless-const: true
        function:
          type: object
          properties:
            name:
              type: string
              description: The name of the function to call.
          required:
          - name
      required:
      - type
      - function
    ChatCompletionNamedToolChoiceCustom:
      type: object
      title: Custom tool choice
      description: Specifies a tool the model should use. Use to force the model to call a specific custom tool.
      properties:
        type:
          type: string
          enum:
          - custom
          description: For custom tool calling, the type is always `custom`.
          x-stainless-const: true
        custom:
          type: object
          properties:
            name:
              type: string
              description: The name of the custom tool to call.
          required:
          - name
      required:
      - type
      - custom
    ChatCompletionRequestAssistantMessage:
      type: object
      title: Assistant message
      description: |-
        Messages sent by the model in response to user messages.
      properties:
        content:
          anyOf:
          - oneOf:
            - type: string
              description: The contents of the assistant message.
              title: Text content
            - type: array
              description: An array of content parts with a defined type. Can be one or more of type `text`, or exactly one of type `refusal`.
              title: Array of content parts
              items:
                $ref: "#/components/schemas/ChatCompletionRequestAssistantMessageContentPart"
              minItems: 1
            description: >-
              The contents of the assistant message. Required unless `tool_calls` or `function_call` is specified.
          - type: "null"
        refusal:
          anyOf:
          - type: string
            description: The refusal message by the assistant.
          - type: "null"
        role:
          type: string
          enum:
          - assistant
          description: The role of the messages author, in this case `assistant`.
          x-stainless-const: true
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
        audio:
          anyOf:
          - type: object
            description: |-
              Data about a previous audio response from the model. [Learn more](/docs/guides/audio).
            required:
            - id
            properties:
              id:
                type: string
                description: >-
                  Unique identifier for a previous audio response from the model.
          - type: "null"
        tool_calls:
          $ref: "#/components/schemas/ChatCompletionMessageToolCalls"
        function_call:
          anyOf:
          - type: object
            deprecated: true
            description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model.
            properties:
              arguments:
                type: string
                description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
              name:
                type: string
                description: The name of the function to call.
            required:
            - arguments
            - name
          - type: "null"
      required:
      - role
    ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartRefusal"
      discriminator:
        propertyName: type
    ChatCompletionRequestDeveloperMessage:
      type: object
      title: Developer message
      description: >-
        Developer-provided instructions that the model should follow, regardless of messages sent by the user. With o1 models and newer, `developer` messages replace the previous `system` messages.
      properties:
        content:
          description: The contents of the developer message.
          oneOf:
          - type: string
            description: The contents of the developer message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. For developer messages, only type `text` is supported.
            title: Array of content parts
            items:
              $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
            minItems: 1
        role:
          type: string
          enum:
          - developer
          description: The role of the messages author, in this case `developer`.
          x-stainless-const: true
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      required:
      - content
      - role
    ChatCompletionRequestFunctionMessage:
      type: object
      title: Function message
      deprecated: true
      properties:
        role:
          type: string
          enum:
          - function
          description: The role of the messages author, in this case `function`.
          x-stainless-const: true
        content:
          anyOf:
          - type: string
            description: The contents of the function message.
          - type: "null"
        name:
          type: string
          description: The name of the function to call.
      required:
      - role
      - content
      - name
    ChatCompletionRequestMessage:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestDeveloperMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestSystemMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestUserMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestToolMessage"
      - $ref: "#/components/schemas/ChatCompletionRequestFunctionMessage"
      discriminator:
        propertyName: role
    ChatCompletionRequestMessageContentPartAudio:
      type: object
      title: Audio content part
      description: |-
        Learn about [audio inputs](/docs/guides/audio).
      properties:
        type:
          type: string
          enum:
          - input_audio
          description: The type of the content part. Always `input_audio`.
          x-stainless-const: true
        input_audio:
          type: object
          properties:
            data:
              type: string
              description: Base64 encoded audio data.
            format:
              type: string
              enum:
              - wav
              - mp3
              description: >-
                The format of the encoded audio data. Currently supports "wav" and "mp3".
          required:
          - data
          - format
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointParam"
      required:
      - type
      - input_audio
    ChatCompletionRequestMessageContentPartFile:
      type: object
      title: File content part
      description: |-
        Learn about [file inputs](/docs/guides/text) for text generation.
      properties:
        type:
          type: string
          enum:
          - file
          description: The type of the content part. Always `file`.
          x-stainless-const: true
        file:
          type: object
          properties:
            filename:
              type: string
              description: >-
                The name of the file, used when passing the file to the model as a  string.
            file_data:
              type: string
              description: >-
                The base64 encoded file data, used when passing the file to the model  as a string.
            file_id:
              type: string
              description: |-
                The ID of an uploaded file to use as input.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointParam"
      required:
      - type
      - file
    ChatCompletionRequestMessageContentPartImage:
      type: object
      title: Image content part
      description: |-
        Learn about [image inputs](/docs/guides/vision).
      properties:
        type:
          type: string
          enum:
          - image_url
          description: The type of the content part.
          x-stainless-const: true
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
              format: uri
            detail:
              type: string
              description: Specifies the detail level of the image. Learn more in the [Vision guide](/docs/guides/vision#low-or-high-fidelity-image-understanding).
              enum:
              - auto
              - low
              - high
              default: auto
          required:
          - url
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointParam"
      required:
      - type
      - image_url
    ChatCompletionRequestMessageContentPartRefusal:
      type: object
      title: Refusal content part
      properties:
        type:
          type: string
          enum:
          - refusal
          description: The type of the content part.
          x-stainless-const: true
        refusal:
          type: string
          description: The refusal message generated by the model.
      required:
      - type
      - refusal
    ChatCompletionRequestMessageContentPartText:
      type: object
      title: Text content part
      description: |-
        Learn about [text inputs](/docs/guides/text-generation).
      properties:
        type:
          type: string
          enum:
          - text
          description: The type of the content part.
          x-stainless-const: true
        text:
          type: string
          description: The text content.
        prompt_cache_breakpoint:
          $ref: "#/components/schemas/PromptCacheBreakpointParam"
      required:
      - type
      - text
    ChatCompletionRequestSystemMessage:
      type: object
      title: System message
      description: >-
        Developer-provided instructions that the model should follow, regardless of messages sent by the user. With o1 models and newer, use `developer` messages for this purpose instead.
      properties:
        content:
          description: The contents of the system message.
          oneOf:
          - type: string
            description: The contents of the system message.
            title: Text content
          - type: array
            description: An array of content parts with a defined type. For system messages, only type `text` is supported.
            title: Array of content parts
            items:
              $ref: "#/components/schemas/ChatCompletionRequestSystemMessageContentPart"
            minItems: 1
        role:
          type: string
          enum:
          - system
          description: The role of the messages author, in this case `system`.
          x-stainless-const: true
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      required:
      - content
      - role
    ChatCompletionRequestSystemMessageContentPart:
      oneOf:
      - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
    ChatCompletionRequestToolMessage:
      type: object
      title: Tool message
      properties:
        role:
          type: string
          enum:
          - tool
