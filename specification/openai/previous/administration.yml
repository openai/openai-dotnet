components:
  schemas:
    AdminApiKey:
      type: object
      description: Represents an individual Admin API key in an org.
      properties:
        object:
          type: string
          enum:
          - organization.admin_api_key
          description: The object type, which is always `organization.admin_api_key`
          x-stainless-const: true
        id:
          type: string
          example: key_abc
          description: The identifier, which can be referenced in API endpoints
        name:
          anyOf:
          - type: string
          - type: "null"
          example: Administration Key
          description: The name of the API key
        redacted_value:
          type: string
          example: sk-admin...def
          description: The redacted value of the API key
        created_at:
          type: integer
          format: unixtime
          example: 1711471533
          description: The Unix timestamp (in seconds) of when the API key was created
        expires_at:
          anyOf:
          - type: integer
            format: unixtime
            example: 1714063533
            description: The Unix timestamp (in seconds) of when the API key expires
          - type: "null"
        last_used_at:
          anyOf:
          - type: integer
            format: unixtime
            example: 1711471534
            description: The Unix timestamp (in seconds) of when the API key was last used
          - type: "null"
        owner:
          type: object
          properties:
            type:
              type: string
              example: user
              description: Always `user`
            object:
              type: string
              example: organization.user
              description: The object type, which is always organization.user
            id:
              type: string
              example: sa_456
              description: The identifier, which can be referenced in API endpoints
            name:
              type: string
              example: My Service Account
              description: The name of the user
            created_at:
              type: integer
              format: unixtime
              example: 1711471533
              description: The Unix timestamp (in seconds) of when the user was created
            role:
              type: string
              example: owner
              description: Always `owner`
      required:
      - object
      - redacted_value
      - created_at
      - expires_at
      - id
      - owner
    AdminApiKeyCreateResponse:
      allOf:
      - $ref: "#/components/schemas/AdminApiKey"
      - type: object
        description: The newly created admin API key. The `value` field is only returned once, when the key is created.
        properties:
          value:
            type: string
            example: sk-admin-1234abcd
            description: The value of the API key. Only shown on create.
        required:
        - value
    ApiKeyList:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
          example: list
          x-stainless-const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminApiKey"
        has_more:
          type: boolean
          example: false
        first_id:
          anyOf:
          - type: string
          - type: "null"
          example: key_abc
        last_id:
          anyOf:
          - type: string
          - type: "null"
          example: key_xyz
      required:
      - object
      - data
      - has_more
    AssignedRoleDetails:
      type: object
      description: Detailed information about a role assignment entry returned when listing assignments.
      properties:
        id:
          type: string
          description: Identifier for the role.
        name:
          type: string
          description: Name of the role.
        permissions:
          type: array
          description: Permissions associated with the role.
          items:
            type: string
        resource_type:
          type: string
          description: Resource type the role applies to.
        predefined_role:
          type: boolean
          description: Whether the role is predefined by OpenAI.
        description:
          description: Description of the role.
          anyOf:
          - type: string
          - type: "null"
        created_at:
          description: When the role was created.
          anyOf:
          - type: integer
            format: unixtime
          - type: "null"
        updated_at:
          description: When the role was last updated.
          anyOf:
          - type: integer
            format: unixtime
          - type: "null"
        created_by:
          description: Identifier of the actor who created the role.
          anyOf:
          - type: string
          - type: "null"
        created_by_user_obj:
          description: User details for the actor that created the role, when available.
          anyOf:
          - type: object
            additionalProperties: true
          - type: "null"
        metadata:
          description: Arbitrary metadata stored on the role.
          anyOf:
          - type: object
            additionalProperties: true
          - type: "null"
        assignment_sources:
          description: Principals from which the role assignment is inherited, when available.
          anyOf:
          - type: array
            items:
              type: object
              properties:
                principal_id:
                  type: string
                principal_type:
                  type: string
              required:
              - principal_id
              - principal_type
          - type: "null"
      required:
      - id
      - name
      - permissions
      - resource_type
      - predefined_role
      - description
      - created_at
      - updated_at
      - created_by
      - created_by_user_obj
      - metadata
      - assignment_sources
    AuditLog:
      type: object
      description: A log of a user action or configuration change within this organization.
      properties:
        id:
          type: string
          description: The ID of this log.
        type:
          $ref: "#/components/schemas/AuditLogEventType"
        effective_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of the event.
        project:
          type: object
          description: The project that the action was scoped to. Absent for actions not scoped to projects. Note that any admin actions taken via Admin API keys are associated with the default project.
          properties:
            id:
              type: string
              description: The project ID.
            name:
              type: string
              description: The project title.
        actor:
          anyOf:
          - $ref: "#/components/schemas/AuditLogActor"
          - type: "null"
        api_key.created:
          type: object
          description: The details for events with this `type`.
          properties:
            id:
              type: string
              description: The tracking ID of the API key.
            data:
              type: object
              description: The payload used to create the API key.
              properties:
                scopes:
                  type: array
                  items:
                    type: string
                  description: A list of scopes allowed for the API key, e.g. `["api.model.request"]`
        api_key.updated:
          type: object
          description: The details for events with this `type`.
          properties:
            id:
              type: string
              description: The tracking ID of the API key.
            changes_requested:
              type: object
              description: The payload used to update the API key.
              properties:
                scopes:
                  type: array
                  items:
                    type: string
                  description: A list of scopes allowed for the API key, e.g. `["api.model.request"]`
        api_key.deleted:
