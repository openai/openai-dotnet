openapi: 3.1.0
info:
  title: OpenAI API — Administration
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Audit Logs
  description: List user actions and configuration changes within this organization.
paths:
  /organization/admin_api_keys:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: List organization API keys
      operationId: admin-api-keys-list
      description: Retrieve a paginated list of organization admin API keys.
      parameters:
      - in: query
        name: after
        required: false
        schema:
          type: string
          nullable: true
          description: Return keys with IDs that come after this ID in the pagination order.
      - in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Order results by creation time, ascending or descending.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          description: Maximum number of keys to return.
      responses:
        "200":
          description: A list of organization API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Create an organization admin API key
      operationId: admin-api-keys-create
      description: Create a new admin-level API key for the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: New Admin Key
                expires_in_seconds:
                  type: integer
                  minimum: 1
                  maximum: 31536000
                  example: 2592000
                  description: The number of seconds until the API key expires. Omit this field for a key that does not expire.
      responses:
        "200":
          description: The newly created admin API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApiKeyCreateResponse"
  /organization/admin_api_keys/{key_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieve a single organization API key
      operationId: admin-api-keys-get
      description: Get details for a specific organization API key by its ID.
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          type: string
          description: The ID of the API key.
      responses:
        "200":
          description: Details of the requested API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApiKey"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Delete an organization admin API key
      operationId: admin-api-keys-delete
      description: Delete the specified admin API key.
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          type: string
          description: The ID of the API key to be deleted.
      responses:
        "200":
          description: Confirmation that the API key was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: key_abc
                  object:
                    type: string
                    enum:
                    - organization.admin_api_key.deleted
                    example: organization.admin_api_key.deleted
                    x-stainless-const: true
                  deleted:
                    type: boolean
                    example: true
                required:
                - id
                - object
                - deleted
  /organization/audit_logs:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: List user actions and configuration changes within this organization.
      operationId: list-audit-logs
      tags:
      - Audit Logs
      parameters:
      - name: effective_at
        in: query
        description: Return only events whose `effective_at` (Unix seconds) is in this range.
        required: false
        schema:
          type: object
          properties:
            gt:
              type: integer
              description: Return only events whose `effective_at` (Unix seconds) is greater than this value.
            gte:
              type: integer
              description: Return only events whose `effective_at` (Unix seconds) is greater than or equal to this value.
            lt:
              type: integer
              description: Return only events whose `effective_at` (Unix seconds) is less than this value.
            lte:
              type: integer
              description: Return only events whose `effective_at` (Unix seconds) is less than or equal to this value.
      - name: project_ids[]
        in: query
        description: Return only events for these projects.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: event_types[]
        in: query
        description: Return only events with a `type` in one of these values. For example, `project.created`. For all options, see the documentation for the [audit log object](/docs/api-reference/audit-logs/object).
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEventType"
      - name: actor_ids[]
        in: query
        description: Return only events performed by these actors. Can be a user ID, a service account ID, or an api key tracking ID.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: actor_emails[]
        in: query
        description: Return only events performed by users with these emails.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: resource_ids[]
        in: query
        description: Return only events performed on these targets. For example, a project ID updated. For ChatGPT connector role events, use the workspace connector resource ID shown in `details.id`, such as `<workspace_id>__<connector_id>`.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: tenant_only
        in: query
        description: Return only tenant-scoped events associated with this organization. Required for tenant-scoped events such as `role.bound_to_resource` and `role.unbound_from_resource`. When `true`, all supplied event types must be tenant-scoped.
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: >-
          A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 20.
        required: false
        schema:
          type: integer
          default: 20
      - name: after
        in: query
        description: >-
          A cursor for use in pagination. `after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with obj_foo, your subsequent call can include after=obj_foo in order to fetch the next page of the list.
        schema:
          type: string
      - name: before
        in: query
        description: >-
          A cursor for use in pagination. `before` is an object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, starting with obj_foo, your subsequent call can include before=obj_foo in order to fetch the previous page of the list.
        schema:
          type: string
      responses:
        "200":
          description: Audit logs listed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"
  /organization/certificates:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: List uploaded certificates for this organization.
      operationId: listOrganizationCertificates
      tags:
      - Certificates
      parameters:
      - name: limit
        in: query
        description: >-
          A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 20.
        required: false
        schema:
          type: integer
          default: 20
      - name: after
        in: query
        description: >-
          A cursor for use in pagination. `after` is an object ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with obj_foo, your subsequent call can include after=obj_foo in order to fetch the next page of the list.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: >-
          Sort order by the `created_at` timestamp of the objects. `asc` for ascending order and `desc` for descending order.
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        "200":
          description: Certificates listed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCertificatesResponse"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: >-
        Upload a certificate to the organization. This does **not** automatically activate the certificate.

        Organizations can upload up to 50 certificates.
      operationId: uploadCertificate
      tags:
      - Certificates
      requestBody:
        description: The certificate upload payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCertificateRequest"
      responses:
        "200":
          description: Certificate uploaded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
  /organization/certificates/activate:
    post:
      security:
      - AdminApiKeyAuth: []
      summary: >-
        Activate certificates at the organization level.

        You can atomically and idempotently activate up to 10 certificates at a time.
      operationId: activateOrganizationCertificates
      tags:
      - Certificates
      requestBody:
        description: The certificate activation payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleCertificatesRequest"
      responses:
        "200":
          description: Certificates activated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCertificateActivationResponse"
  /organization/certificates/deactivate:
    post:
      security:
      - AdminApiKeyAuth: []
      summary: >-
        Deactivate certificates at the organization level.

        You can atomically and idempotently deactivate up to 10 certificates at a time.
      operationId: deactivateOrganizationCertificates
      tags:
      - Certificates
      requestBody:
        description: The certificate deactivation payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleCertificatesRequest"
      responses:
        "200":
          description: Certificates deactivated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCertificateDeactivationResponse"
  /organization/certificates/{certificate_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: |-
        Get a certificate that has been uploaded to the organization.
        You can get a certificate regardless of whether it is active or not.
      operationId: getCertificate
      tags:
      - Certificates
      parameters:
      - name: certificate_id
        in: path
        description: Unique ID of the certificate to retrieve.
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: A list of additional fields to include in the response. Currently the only supported value is `content` to fetch the PEM content of the certificate.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - content
      responses:
        "200":
          description: Certificate retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: |-
        Modify a certificate. Note that only the name can be modified.
      operationId: modifyCertificate
      tags:
      - Certificates
      parameters:
      - name: certificate_id
        in: path
        description: Unique ID of the certificate to modify.
        required: true
        schema:
          type: string
      requestBody:
        description: The certificate modification payload.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCertificateRequest"
      responses:
        "200":
          description: Certificate modified successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: |-
        Delete a certificate from the organization.
        The certificate must be inactive for the organization and all projects.
      operationId: deleteCertificate
      tags:
      - Certificates
      parameters:
      - name: certificate_id
        in: path
        description: Unique ID of the certificate to delete.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Certificate deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCertificateResponse"
  /organization/costs:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Get costs details for the organization.
      operationId: usage-costs
      tags:
      - Usage
      parameters:
      - name: start_time
        in: query
        description: Start time (Unix seconds) of the query time range, inclusive.
        required: true
        schema:
          type: integer
      - name: end_time
        in: query
        description: End time (Unix seconds) of the query time range, exclusive.
        required: false
        schema:
          type: integer
      - name: bucket_width
        in: query
        description: Width of each time bucket in response. Currently only `1d` is supported, default to `1d`.
        required: false
        schema:
          type: string
          enum:
          - 1d
          default: 1d
      - name: project_ids
        in: query
        description: Return only costs for these projects.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: api_key_ids
        in: query
        description: Return only costs for these API keys.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: group_by
        in: query
        description: Group the costs by the specified fields. Support fields include `project_id`, `line_item`, `api_key_id` and any combination of them.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - project_id
            - line_item
            - api_key_id
      - name: limit
        in: query
        description: >-
          A limit on the number of buckets to be returned. Limit can range between 1 and 180, and the default is 7.
        required: false
        schema:
          type: integer
          default: 7
      - name: page
        in: query
        description: A cursor for use in pagination. Corresponding to the `next_page` field from the previous response.
        schema:
          type: string
      responses:
        "200":
          description: Costs data retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
  /organization/data_retention:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieves organization data retention controls.
      operationId: retrieve-organization-data-retention
      tags:
      - Data retention
      responses:
        "200":
          description: Organization data retention controls retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataRetention"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Updates organization data retention controls.
      operationId: update-organization-data-retention
      tags:
      - Data retention
      requestBody:
        description: The desired organization data retention setting.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationDataRetentionBody"
      responses:
        "200":
          description: Organization data retention controls updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDataRetention"
  /organization/groups:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Lists all groups in the organization.
      operationId: list-groups
      tags:
      - Groups
      parameters:
      - name: limit
        in: query
        description: >-
          A limit on the number of groups to be returned. Limit can range between 0 and 1000, and the default is 100.
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
      - name: after
        in: query
        description: >-
          A cursor for use in pagination. `after` is a group ID that defines your place in the list. For instance, if you make a list request and receive 100 objects, ending with group_abc, your subsequent call can include `after=group_abc` in order to fetch the next page of the list.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: Specifies the sort order of the returned groups.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        "200":
          description: Groups listed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResource"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Creates a new group in the organization.
      operationId: create-group
      tags:
      - Groups
      requestBody:
        description: Parameters for the group you want to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "200":
          description: Group created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
  /organization/groups/{group_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieves a group.
      operationId: retrieve-group
      tags:
      - Groups
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to retrieve.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Group retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Updates a group's information.
      operationId: update-group
      tags:
      - Groups
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to update.
        required: true
        schema:
          type: string
      requestBody:
        description: New attributes to set on the group.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupBody"
      responses:
        "200":
          description: Group updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResourceWithSuccess"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Deletes a group from the organization.
      operationId: delete-group
      tags:
      - Groups
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to delete.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Group deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDeletedResource"
  /organization/groups/{group_id}/roles:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Lists the organization roles assigned to a group within the organization.
      operationId: list-group-role-assignments
      tags:
      - Group organization role assignments
      parameters:
      - name: group_id
        in: path
        description: The ID of the group whose organization role assignments you want to list.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: A limit on the number of organization role assignments to return.
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000
      - name: after
        in: query
        description: Cursor for pagination. Provide the value from the previous response's `next` field to continue listing organization roles.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: Sort order for the returned organization roles.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        "200":
          description: Group organization role assignments listed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResource"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Assigns an organization role to a group within the organization.
      operationId: assign-group-role
      tags:
      - Group organization role assignments
      parameters:
      - name: group_id
        in: path
        description: The ID of the group that should receive the organization role.
        required: true
        schema:
          type: string
      requestBody:
        description: Identifies the organization role to assign to the group.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAssignOrganizationGroupRoleBody"
      responses:
        "200":
          description: Organization role assigned to the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRoleAssignment"
  /organization/groups/{group_id}/roles/{role_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieves an organization role assigned to a group.
      operationId: retrieve-group-role
      tags:
      - Group organization role assignments
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to inspect.
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        description: The ID of the organization role to retrieve for the group.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Organization role retrieved for the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedRoleDetails"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Unassigns an organization role from a group within the organization.
      operationId: unassign-group-role
      tags:
      - Group organization role assignments
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to modify.
        required: true
        schema:
          type: string
      - name: role_id
        in: path
        description: The ID of the organization role to remove from the group.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Organization role unassigned from the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedRoleAssignmentResource"
  /organization/groups/{group_id}/users:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Lists the users assigned to a group.
      operationId: list-group-users
      tags:
      - Group users
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to inspect.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: >-
          A limit on the number of users to be returned. Limit can range between 0 and 1000, and the default is 100.
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
      - name: after
        in: query
        description: >-
          A cursor for use in pagination. Provide the ID of the last user from the previous list response to retrieve the next page.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: Specifies the sort order of users in the list.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        "200":
          description: Group users listed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResource"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Adds a user to a group.
      operationId: add-group-user
      tags:
      - Group users
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to update.
        required: true
        schema:
          type: string
      requestBody:
        description: Identifies the user that should be added to the group.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupUserBody"
      responses:
        "200":
          description: User added to the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupUserAssignment"
  /organization/groups/{group_id}/users/{user_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieves a user in a group.
      operationId: retrieve-group-user
      tags:
      - Group users
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to inspect.
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        description: The ID of the user to retrieve from the group.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User retrieved from the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberUser"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Removes a user from a group.
      operationId: remove-group-user
      tags:
      - Group users
      parameters:
      - name: group_id
        in: path
        description: The ID of the group to update.
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        description: The ID of the user to remove from the group.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: User removed from the group successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupUserDeletedResource"
  /organization/invites:
    get:
      security:
      - AdminApiKeyAuth: []
